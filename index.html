<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Управление Фотоцентром</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F10; --bg-2: #18181B; --surface: #1B1B1E; --surface-2: #232326;
    --ink: #F1EDE4; --ink-soft: #9C978C; --line: #2A2A2D; --line-strong: #38383C;
    --red: #C6685A; --blue: #7C9BC2; --brass: #C7A15C; --green: #7FAE8E;
    --warn-tint: rgba(199,161,92,0.14); --danger-tint: rgba(198,104,90,0.15); --radius: 12px; --radius-sm: 8px;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; min-height:100vh; font-family:'IBM Plex Sans', sans-serif; background:var(--bg); color:var(--ink); }
  button, input, select, textarea { font-family:inherit; touch-action: manipulation; }

  #root { width: 100%; max-width: 1000px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
  @media (min-width: 768px) { #root { padding-top: 16px; } }

  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  /* Header & Navigation */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .role-chip { font-size:10px; text-transform:uppercase; color:var(--brass); font-weight:600; letter-spacing:0.05em; }

  .nav-tabs { display:flex; gap:8px; overflow-x:auto; padding:12px 20px; background:var(--bg-2); border-bottom:1px solid var(--line); }
  .tab-btn { padding:8px 14px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:transparent; color:var(--ink-soft); font-size:12px; flex:none; cursor:pointer; }
  .tab-btn.active { background:var(--brass); color:#100F0D; border-color:var(--brass); font-weight:600; }

  /* Grid & Panels */
  .content { padding:20px; }
  .stats-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .stat-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .stat-value { font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; color:var(--green); }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .field { margin-bottom:12px; }
  .field-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:6px; }
  
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea { width:100%; border:1px solid var(--line-strong); background:var(--bg-2); padding:10px 12px; font-size:14px; color:var(--ink); border-radius:var(--radius-sm); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--brass); }

  .btn { border:none; background:var(--ink); color:var(--bg); padding:10px 16px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; border-radius:var(--radius-sm); font-weight:600; width:100%; cursor:pointer; margin-top:6px; }
  .btn.gold { background:var(--brass); color:#100F0D; }
  .btn.blue { background:var(--blue); color:#fff; }
  .btn.green { background:var(--green); color:#fff; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.outline { background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
  .btn.small { width:auto; padding:6px 12px; font-size:11px; margin:0; }

  .payout-card { border:1px solid var(--brass); background:var(--warn-tint); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; }
  .public-wrap { min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; max-width:420px; margin:0 auto; padding:20px; text-align:center; }

  /* Chat Styles */
  .chat-box { max-height: 380px; overflow-y: auto; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { background: var(--surface-2); padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line); font-size: 13px; position: relative; }
  .chat-msg.mine { border-color: var(--brass); background: rgba(199, 161, 92, 0.08); align-self: flex-end; width: 85%; }
  .chat-msg-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .chat-msg-body { word-break: break-word; white-space: pre-wrap; margin-bottom: 6px; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:var(--radius-sm); font-size:13px; font-family:'IBM Plex Mono', monospace; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.show { opacity:1; }
  #toast.err { background:var(--red); color:#fff; }
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="root"></div>
<div id="toast"></div>

<script>
// ==========================================
// 1. CONFIG / КЛЮЧИ (ВСТАВЬТЕ СВОИ ДАННЫЕ)
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyAWjkzWoXK3F-YTjq5qPEVLL2Li6pAoO0g",
  authDomain: "photo-center-tuapse.firebaseapp.com",
  databaseURL: "https://photo-center-tuapse-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "photo-center-tuapse",
  storageBucket: "photo-center-tuapse.firebasestorage.app",
  messagingSenderId: "633147729123",
  appId: "1:633147729123:web:04247d0657312a4301d1d6"
};

const IMGBB_API_KEY = "62e211fd034a3eb244e89ca683c7181b";

// Инициализация Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref('app_state');

// ==========================================
// 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И СОСТОЯНИЕ
// ==========================================
const money = n => (Math.round(n||0)).toLocaleString('ru-RU') + ' ₽';
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowFormatted = () => new Date().toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });

function defaultState() {
  return {
    masterPassword: '12345',
    currentSeason: new Date().getFullYear().toString(),
    users: [
      { id: 'owner_1', username: 'Owner', password: '123', role: 'owner', salaryBalance: 0 }
    ],
    points: [
      { id: 'pt_1', name: 'Главная точка', revenue: 0, small: 100, big: 100, salaryPercent: 10 }
    ],
    salesEntries: [],
    purchaseEntries: [],
    payoutRequests: [],
    digitalPhotos: [],
    archivedSeasons: [],
    chatMessages: []
  };
}

let state = defaultState();
let session = { userId: null, currentTab: 'download_public', ownerSubTab: 'overview', userSubTab: 'main', activeChatTarget: 'all' };

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.className = '', 2800);
}

// Синхронизация с Firebase Realtime Database
dbRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (data) {
    state = data;
    if (!state.masterPassword) state.masterPassword = '12345';
    if (!state.currentSeason) state.currentSeason = new Date().getFullYear().toString();
    if (!state.users) state.users = [];
    if (!state.points) state.points = [];
    if (!state.salesEntries) state.salesEntries = [];
    if (!state.purchaseEntries) state.purchaseEntries = [];
    if (!state.payoutRequests) state.payoutRequests = [];
    if (!state.digitalPhotos) state.digitalPhotos = [];
    if (!state.archivedSeasons) state.archivedSeasons = [];
    if (!state.chatMessages) state.chatMessages = [];
  } else {
    state = defaultState();
    saveData();
  }
  render();
});

function saveData() {
  dbRef.set(state).catch(err => {
    toast('Ошибка сохранения в Базу Данных', true);
    console.error(err);
  });
}

function currentUser() { return state.users.find(u => u.id === session.userId) || null; }

function render() {
  const root = document.getElementById('root');
  const user = currentUser();

  if (session.currentTab === 'download_public') {
    root.innerHTML = renderPublicDownloadPage();
    return;
  }

  if (!user) {
    root.innerHTML = renderAuthPage();
    return;
  }

  if (user.role === 'owner') root.innerHTML = renderOwnerDashboard(user);
  else if (user.role === 'employee') root.innerHTML = renderEmployeeDashboard(user);
  else if (user.role === 'buyer') root.innerHTML = renderBuyerDashboard(user);
}

/* PUBLIC DOWNLOAD PAGE */
function renderPublicDownloadPage() {
  return `
  <div class="public-wrap fade-in">
    <h2>Скачать Фотографии</h2>
    <p style="color:var(--ink-soft); font-size:13px;">Введите код заказа для получения фотографий</p>
    <div style="width:100%; margin:16px 0;">
      <input type="text" id="photoCodeInput" placeholder="Код заказа (например 1024)" style="text-align:center; font-size:18px;">
      <button class="btn gold" onclick="searchPhotoByCode()">Найти фото</button>
    </div>
    <div id="photoSearchResult"></div>
    <div style="margin-top:24px; font-size:13px; color:var(--ink-soft); background:var(--surface); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--line); width:100%;">
      Возникли проблемы или ошибки?<br>
      Обратная связь: <a href="tel:+79256860074" style="color:var(--brass); text-decoration:none; font-weight:600;">+7 925 686 00 74</a>
    </div>
    <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:20px; width:100%;">
      <button class="btn outline" onclick="session.currentTab='login'; render();">Вход для персонала</button>
    </div>
  </div>`;
}

function searchPhotoByCode() {
  const code = document.getElementById('photoCodeInput').value.trim();
  const res = document.getElementById('photoSearchResult');
  if(!code) return toast('Введите код', true);

  const photos = state.digitalPhotos.filter(p => p.code === code);
  if(!photos.length) {
    res.innerHTML = `<p style="color:var(--red); margin-top:12px;">Фотографии не найдены</p>`;
    return;
  }

  photos.forEach(p => p.downloaded = true);
  saveData();

  res.innerHTML = `
    <div style="margin-top:16px; width:100%;">
      <p style="font-size:13px; color:var(--green); font-weight:600; margin-bottom:12px;">Найдено снимков: ${photos.length}</p>
      ${photos.map((p, idx) => `
        <div class="panel fade-in" style="margin-bottom:12px; text-align:left;">
          <img src="${p.photoUrl}" style="width:100%; border-radius:var(--radius-sm); margin-bottom:10px;">
          <a href="${p.photoUrl}" download="Photo_${p.code}_${idx+1}.jpg" target="_blank" class="btn green" style="display:block; text-align:center; text-decoration:none;">Скачать фото №${idx+1}</a>
        </div>
      `).join('')}
    </div>
  `;
}

/* AUTHENTICATION */
function renderAuthPage() {
  return `
  <div class="public-wrap fade-in">
    <h2>Авторизация</h2>
    <div class="panel" style="width:100%;">
      <div class="field"><label class="field-label">Логин</label><input type="text" id="loginUser"></div>
      <div class="field"><label class="field-label">Пароль</label><input type="password" id="loginPass"></div>
      <button class="btn gold" onclick="handleLogin()">Войти</button>
    </div>
    <button class="btn outline" onclick="session.currentTab='download_public'; render();">На страницу скачивания</button>
  </div>`;
}

function handleLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const user = state.users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
  
  if(!user) return toast('Неверный логин или пароль', true);
  session.userId = user.id;
  session.currentTab = 'main';
  session.userSubTab = 'main';
  render();
}

/* ЧАТ */
function renderChatSection(user) {
  const targetId = session.activeChatTarget || 'all';

  const visibleMessages = state.chatMessages.filter(m => {
    if (m.targetId === 'all') return true;
    return (m.senderId === user.id && m.targetId === targetId) ||
           (m.senderId === targetId && m.targetId === user.id);
  });

  const otherUsers = state.users.filter(u => u.id !== user.id);

  return `
  <div class="panel fade-in">
    <h3>Сообщения и Чат</h3>
    <div class="field">
      <label class="field-label">Кому написать:</label>
      <select onchange="session.activeChatTarget = this.value; render();">
        <option value="all" ${targetId === 'all' ? 'selected' : ''}>📢 Общий чат (для всех)</option>
        ${otherUsers.map(u => `
          <option value="${u.id}" ${targetId === u.id ? 'selected' : ''}>
            👤 ${u.username} (${u.role === 'owner' ? 'Владелец' : u.role === 'employee' ? 'Продавец' : 'Закупщик'})
          </option>
        `).join('')}
      </select>
    </div>

    <div class="chat-box" id="chatBox">
      ${!visibleMessages.length ? '<p style="font-size:12px; color:var(--ink-soft); text-align:center; margin:auto;">Сообщений пока нет</p>' :
        visibleMessages.map(m => {
          const isMine = m.senderId === user.id;
          const isOwner = user.role === 'owner';
          const canDelete = isMine || isOwner;

          return `
          <div class="chat-msg ${isMine ? 'mine' : ''}">
            <div class="chat-msg-header">
              <b>${m.senderName} ${m.targetId !== 'all' ? '<span style="color:var(--brass);">(Личное)</span>' : ''}</b>
              <span>${m.time}</span>
            </div>
            <div class="chat-msg-body">${m.text}</div>
            ${canDelete ? `<button class="btn small red" style="padding:2px 6px; font-size:10px; width:auto;" onclick="deleteChatMessage('${m.id}')">Удалить</button>` : ''}
          </div>
          `;
        }).join('')}
    </div>

    <div style="display:flex; gap:8px;">
      <textarea id="chatInputText" rows="2" placeholder="Напишите сообщение..." style="resize:none;"></textarea>
      <button class="btn gold" style="width:100px; margin:0;" onclick="sendChatMessage()">Отправить</button>
    </div>
  </div>`;
}

function sendChatMessage() {
  const textInput = document.getElementById('chatInputText');
  const text = textInput ? textInput.value.trim() : '';
  if (!text) return toast('Введите текст сообщения', true);

  const user = currentUser();
  const targetId = session.activeChatTarget || 'all';

  state.chatMessages.push({
    id: uid(),
    senderId: user.id,
    senderName: user.username,
    targetId: targetId,
    text: text,
    time: nowFormatted()
  });

  saveData();
  if (textInput) textInput.value = '';
}

function deleteChatMessage(msgId) {
  const user = currentUser();
  const msg = state.chatMessages.find(m => m.id === msgId);
  if (!msg) return;

  if (user.role === 'owner' || msg.senderId === user.id) {
    if (confirm('Удалить это сообщение?')) {
      state.chatMessages = state.chatMessages.filter(m => m.id !== msgId);
      saveData();
      toast('Сообщение удалено');
    }
  } else {
    toast('У вас нет прав на удаление этого сообщения', true);
  }
}

/* ОБЩИЙ БЛОК ЛИЧНОГО КАБИНЕТА */
function renderProfileCabinet(user) {
  return `
  <div class="panel fade-in" style="border-color:var(--brass);">
    <h3>Личный кабинет: ${user.username}</h3>
    <p style="font-size:12px; color:var(--ink-soft); margin-bottom:16px;">
      Роль: <b style="color:var(--ink);">${user.role === 'owner' ? 'Владелец' : user.role === 'employee' ? 'Продавец' : 'Закупщик'}</b>
    </p>

    <div class="panel" style="background:var(--bg-2);">
      <h4 style="margin-top:0;">Смена пароля аккаунта</h4>
      <div class="field"><label class="field-label">Текущий пароль</label><input type="password" id="currPassword"></div>
      <div class="field"><label class="field-label">Новый пароль</label><input type="password" id="newPassword"></div>
      <div class="field"><label class="field-label">Повторите новый пароль</label><input type="password" id="confirmPassword"></div>
      <button class="btn gold" onclick="changeMyPassword()">Сохранить новый пароль</button>
    </div>

    ${user.role === 'owner' ? `
    <div class="panel" style="background:var(--bg-2); border-color:var(--red);">
      <h4 style="margin-top:0; color:var(--red);">Безопасность: Сбросовый Мастер-пароль</h4>
      <p style="font-size:11px; color:var(--ink-soft);">Специальный пароль для подтверждения полного сброса данных или смены сезона.</p>
      <div class="field"><label class="field-label">Текущий Мастер-пароль</label><input type="password" id="currMasterPass"></div>
      <div class="field"><label class="field-label">Новый Мастер-пароль</label><input type="password" id="newMasterPass"></div>
      <button class="btn red" onclick="changeMasterPassword()">Изменить Мастер-пароль</button>
    </div>
    ` : ''}
  </div>`;
}

function changeMyPassword() {
  const curr = document.getElementById('currPassword').value;
  const newP = document.getElementById('newPassword').value;
  const confP = document.getElementById('confirmPassword').value;

  const user = currentUser();
  if(!curr || !newP || !confP) return toast('Заполните все поля', true);
  if(user.password !== curr) return toast('Неверный текущий пароль', true);
  if(newP !== confP) return toast('Новые пароли не совпадают', true);

  user.password = newP;
  saveData();
  toast('Пароль аккаунта изменён!');
}

function changeMasterPassword() {
  const curr = document.getElementById('currMasterPass').value;
  const newP = document.getElementById('newMasterPass').value;

  if(curr !== state.masterPassword) return toast('Неверный текущий мастер-пароль', true);
  if(!newP || newP.length < 3) return toast('Пароль слишком короткий', true);

  state.masterPassword = newP;
  saveData();
  toast('Мастер-пароль сброса изменен!');
}

/* EMPLOYEE DASHBOARD */
function renderEmployeeDashboard(user) {
  const allowedPoints = state.points.filter(p => user.assignedPoints && user.assignedPoints.includes(p.id));
  const selectedPtId = session.selectedEmployeePointId || (allowedPoints[0] && allowedPoints[0].id);
  const point = state.points.find(p => p.id === selectedPtId);

  return `
  <div class="topbar">
    <div><b>${point ? point.name : 'Продавец'}</b> <span class="role-chip">(${user.username})</span></div>
    <div>
      <button class="btn small gold" onclick="session.userSubTab = (session.userSubTab==='chat'?'main':'chat'); render();">
        ${session.userSubTab === 'chat' ? 'Главная' : '💬 Чат'}
      </button>
      <button class="btn small gold" onclick="session.userSubTab = (session.userSubTab==='profile'?'main':'profile'); render();">
        ${session.userSubTab === 'profile' ? 'Главная' : 'Профиль'}
      </button>
      <button class="btn small outline" onclick="logout()">Выйти</button>
    </div>
  </div>
  <div class="content fade-in">
    ${session.userSubTab === 'chat' ? renderChatSection(user) : ''}
    ${session.userSubTab === 'profile' ? renderProfileCabinet(user) : ''}
    ${session.userSubTab === 'main' ? renderEmployeeMainView(user, allowedPoints, point) : ''}
  </div>`;
}

function renderEmployeeMainView(user, allowedPoints, point) {
  if(!allowedPoints.length) {
    return `<div class="panel">Вам не назначена ни одна точка. Обратитесь к владельцу.</div>`;
  }

  const myPhotos = state.digitalPhotos.filter(p => p.uploadedBy === user.username);
  const myDownloadedCount = myPhotos.filter(p => p.downloaded).length;

  return `
    <div class="panel" style="border-color:var(--brass);">
      <div class="stat-label">Баланс Зарплаты (${state.currentSeason} г.)</div>
      <div class="stat-value">${money(user.salaryBalance || 0)}</div>
      
      <div style="margin-top:12px; border-top:1px solid var(--line); padding-top:10px;">
        <div class="field" style="margin-bottom:6px;">
          <label class="field-label">Запросить выплату (укажите сумму):</label>
          <input type="number" id="empPayoutAmount" value="${user.salaryBalance || 0}">
        </div>
        <button class="btn small gold" onclick="requestCustomBalancePayout('${user.id}')">Запросить выплату</button>
      </div>
    </div>

    ${allowedPoints.length > 1 ? `
    <div class="nav-tabs" style="padding:0 0 12px 0; background:transparent;">
      ${allowedPoints.map(p => `<button class="tab-btn ${p.id === point.id ? 'active' : ''}" onclick="session.selectedEmployeePointId='${p.id}'; render();">${p.name}</button>`).join('')}
    </div>
    ` : ''}

    <div class="panel">
      <h3>Отчет за день: ${point.name}</h3>
      <div class="field"><label class="field-label">Дата отчета</label><input type="date" id="empDate" value="${todayStr()}"></div>
      <div class="field"><label class="field-label">Выручка, ₽</label><input type="number" id="empRev"></div>
      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;"><label class="field-label">Продано мал.</label><input type="number" id="empSm" value="0"></div>
        <div class="field" style="flex:1;"><label class="field-label">Продано бол.</label><input type="number" id="empBg" value="0"></div>
      </div>
      <button class="btn green" onclick="submitEmployeeReport('${point.id}')">Отправить отчет</button>
    </div>

    <div class="panel">

function submitEmployeeReport(pointId) {
  const reportDate = document.getElementById('empDate').value || todayStr();
  const rev = parseFloat(document.getElementById('empRev').value) || 0;
  const small = parseInt(document.getElementById('empSm').value) || 0;
  const big = parseInt(document.getElementById('empBg').value) || 0;
  if(rev <= 0) return toast('Введите корректную выручку', true);

  const point = state.points.find(p => p.id === pointId);
  const user = currentUser();

  point.revenue += rev;
  point.small = Math.max(0, point.small - small);
  point.big = Math.max(0, point.big - big);

  const earned = Math.round(rev * ((point.salaryPercent || 0) / 100));
  user.salaryBalance = (user.salaryBalance || 0) + earned;

  state.salesEntries.unshift({ id: uid(), pointId, date: reportDate, small, big, revenue: rev, userId: user.id, username: user.username, season: state.currentSeason });
  saveData();

  if(confirm(`Отчет принят за ${reportDate}. Начислено: ${earned} ₽. Запросить выплату прямо сейчас?`)) {
    const customAmountStr = prompt(`Укажите сумму для выплаты (Доступный баланс: ${user.salaryBalance} ₽):`, earned);
    const amountToReq = parseFloat(customAmountStr);
    
    if (amountToReq && amountToReq > 0) {
      if (amountToReq > user.salaryBalance) {
        toast('Запрошенная сумма превышает доступный баланс!', true);
      } else {
        state.payoutRequests.unshift({ id: uid(), userId: user.id, username: user.username, amount: amountToReq, type: 'Выплата за день', date: reportDate, status: 'pending' });
        saveData();
        toast('Запрос на выплату отправлен!');

    }
  } else {
    toast('Отчет сохранен!');
  }
}

/* ЗАГРУЗКА ФОТО ЧЕРЕЗ IMGBB API */
async function uploadDigitalPhoto(pointId, codeInputId, fileInputId) {
  const code = document.getElementById(codeInputId).value.trim();
  const fileInput = document.getElementById(fileInputId);
  const files = Array.from(fileInput.files || []);

  if(!code || !files.length) return toast('Укажите код и выберите файлы', true);

  if (IMGBB_API_KEY === "ВАШ_IMGBB_API_KEY") {
    alert('Пожалуйста, замените ВАШ_IMGBB_API_KEY в начале файла на ваш реальный ключ ImgBB!');
    return;
  }

  const isCodeExists = state.digitalPhotos.some(p => p.code === code);
  if(isCodeExists) {
    alert(`Ошибка! Заказ с номером "${code}" уже существует в базе.\nПожалуйста, смените номер заказа.`);
    toast(`Номер "${code}" уже существует! Смените номер.`, true);
    return;
  }

  toast(`Загрузка ${files.length} фото на ImgBB...`);

  let loadedCount = 0;
  for (const file of files) {
    const formData = new FormData();
    formData.append('image', file);

    try {
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });
      const result = await response.json();

      if (result.success) {
        state.digitalPhotos.unshift({
          id: uid(),
          code,
          photoUrl: result.data.url,
          uploadedBy: currentUser().username,
          pointId,
          downloaded: false,
          createdAt: Date.now()
        });
        loadedCount++;
      } else {
        toast(`Ошибка загрузки одного из файлов`, true);
      }
    } catch (err) {
      console.error(err);
      toast('Сетевая ошибка при загрузке', true);
    }
  }

  if (loadedCount > 0) {
    saveData();
    toast(`Успешно загружено фото: ${loadedCount}`);
  }
}

            <button class="btn small red" onclick="adjustBalancePrompt('${u.id}', 'sub')">- Списать</button>
            <button class="btn small outline" onclick="manualClearBalance('${u.id}')">Обнулить</button>
          </div>
        </div>

        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn small gold" onclick="resetUserPasswordPrompt('${u.id}')">Сбросить пароль</button>
          <button class="btn small red" onclick="deleteUser('${u.id}')">Удалить сотрудника</button>
        </div>
      </div>
    `).join('')}
    <button class="btn gold" onclick="addNewUser()">+ Зарегистрировать сотрудника</button>
  </div>`;
}

function resetUserPasswordPrompt(userId) {
  const u = state.users.find(x => x.id === userId);
  const newPass = prompt(`Новый пароль для ${u.username}:`);
  if(!newPass) return;
  u.password = newPass;
  saveData();
  toast(`Пароль для ${u.username} изменен`);
}

function adjustBalancePrompt(userId, action) {
  const u = state.users.find(x => x.id === userId);
  const amountStr = prompt(action === 'add' ? 'Сумма премии (₽):' : 'Сумма списания (₽):');
  const amount = parseFloat(amountStr);
  if(!amount || amount <= 0) return;

  if(action === 'add') u.salaryBalance = (u.salaryBalance || 0) + amount;
  else u.salaryBalance = Math.max(0, (u.salaryBalance || 0) - amount);

  saveData();
}

function renderPointAssignmentSelector(user) {
  return state.points.map(p => {
    const checked = user.assignedPoints && user.assignedPoints.includes(p.id);
    return `<label style="display:inline-block; margin-right:10px; font-size:12px;">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleUserPoint('${user.id}', '${p.id}', this.checked)"> ${p.name}
    </label>`;
  }).join('');
}

function toggleUserPoint(userId, pointId, isChecked) {
  const u = state.users.find(x => x.id === userId);
  if(!u.assignedPoints) u.assignedPoints = [];
  if(isChecked) {
    if(!u.assignedPoints.includes(pointId)) u.assignedPoints.push(pointId);
  } else {
    u.assignedPoints = u.assignedPoints.filter(id => id !== pointId);
  }
  saveData();
}

function updateUserRole(userId, role) {
  const u = state.users.find(x => x.id === userId);
  u.role = role;
  saveData();
}

function manualClearBalance(userId) {
  const u = state.users.find(x => x.id === userId);
  if(confirm(`Обнулить баланс ${money(u.salaryBalance||0)} сотрудника ${u.username}?`)) {
    u.salaryBalance = 0;
    saveData();
  }
}

function approvePayout(requestId) {
  const req = state.payoutRequests.find(r => r.id === requestId);
  if (!req) return;
  const user = state.users.find(u => u.id === req.userId);
  if (confirm(`Выплатить ${money(req.amount)}?`)) {
    if(user) user.salaryBalance = Math.max(0, (user.salaryBalance || 0) - req.amount);
    state.payoutRequests = state.payoutRequests.filter(r => r.id !== requestId);
    saveData();
  }
}

function rejectPayout(requestId) {
  if (confirm(`Отклонить запрос?`)) {
    state.payoutRequests = state.payoutRequests.filter(r => r.id !== requestId);
    saveData();
  }
}

function addNewUser() {
  const u = prompt('Логин сотрудника:');
  const p = prompt('Пароль:');
  if(!u || !p) return;
  state.users.push({ id: uid(), username: u, password: p, role: 'employee', assignedPoints: [], salaryBalance: 0 });
  saveData();
}

function deleteUser(id) {
  if(confirm('Удалить сотрудника?')) {
    state.users = state.users.filter(u => u.id !== id);
    saveData();
  }
}

/* ТЕКУЩИЕ ОТЧЕТЫ ГОДА */
function renderOwnerLogsTab() {
  return `
  <div class="panel">
    <h3>Продажи за текущий сезон (${state.currentSeason})</h3>
    ${!state.salesEntries.length ? '<p style="font-size:12px; color:var(--ink-soft);">Нет записей</p>' :
      state.salesEntries.map(s => {
        const pt = state.points.find(p => p.id === s.pointId);
        return `<div style="border-bottom:1px solid var(--line); padding:8px 0; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <b>${s.date}</b> — ${pt ? pt.name : 'Точка'}: <b>${money(s.revenue)}</b> (${s.small} мал / ${s.big} бол) [${s.username}]
          </div>
          <div>
            <button class="btn small gold" onclick="editSaleEntryCurrent('${s.id}')">Редактировать</button>
            <button class="btn small red" onclick="deleteSaleEntryCurrent('${s.id}')">Удалить</button>
          </div>
        </div>`;
      }).join('')}
  </div>

  <div class="panel">
    <h3>Закупки за текущий сезон (${state.currentSeason})</h3>
    ${!state.purchaseEntries.length ? '<p style="font-size:12px; color:var(--ink-soft);">Нет записей</p>' :
      state.purchaseEntries.map(p => {
        const pt = state.points.find(x => x.id === p.pointId);
        return `<div style="border-bottom:1px solid var(--line); padding:8px 0; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <b>${p.date}</b> — ${pt ? pt.name : 'Точка'}: потрачено <b>${money(p.cost)}</b> (+${p.small} мал / +${p.big} бол) [${p.username}]
          </div>
          <div>
            <button class="btn small red" onclick="deletePurchaseEntryCurrent('${p.id}')">Удалить</button>
          </div>
        </div>`;
      }).join('')}
  </div>`;
}

function editSaleEntryCurrent(id) {
  const item = state.salesEntries.find(x => x.id === id);
  if(!item) return;

  const newRev = prompt('Изменить выручку (₽):', item.revenue);
  if(newRev === null) return;
  const newSm = prompt('Изменить кол-во маленьких:', item.small);
  const newBg = prompt('Изменить кол-во больших:', item.big);

  item.revenue = parseFloat(newRev) || 0;
  item.small = parseInt(newSm) || 0;
  item.big = parseInt(newBg) || 0;

  saveData();
  toast('Запись изменена');
}

function deleteSaleEntryCurrent(id) {
  if(confirm('Удалить запись продажи?')) {
    state.salesEntries = state.salesEntries.filter(x => x.id !== id);
    saveData();
  }
}

function deletePurchaseEntryCurrent(id) {
  if(confirm('Удалить запись закупки?')) {
    state.purchaseEntries = state.purchaseEntries.filter(x => x.id !== id);
    saveData();
  }
}

/* ВЛАДЕЛЕЦ - АРХИВ ПРОШЛЫХ СЕЗОНОВ */
function renderOwnerArchiveTab() {
  if(!state.archivedSeasons.length) {
    return `<div class="panel"><h3>Архив сезонов пуст</h3><p style="font-size:12px; color:var(--ink-soft);">Здесь будут храниться отчеты прошлых лет после завершения сезонов.</p></div>`;
  }

  return `
  <div class="panel">
    <h3>Архив Прошлых Сезонов</h3>
    ${state.archivedSeasons.map(archive => `
      <div style="border:1px solid var(--brass); border-radius:var(--radius-sm); padding:12px; margin-bottom:16px;">
        <h4 style="margin:0 0 10px 0; color:var(--brass);">Сезон: ${archive.seasonName}</h4>
        
        <b>Продажи (${archive.salesEntries ? archive.salesEntries.length : 0}):</b>
        <div style="max-height:200px; overflow-y:auto; margin:8px 0; background:var(--bg-2); padding:8px; border-radius:6px;">
          ${!archive.salesEntries || !archive.salesEntries.length ? '<p style="font-size:11px; color:var(--ink-soft);">Нет записей</p>' : 
            archive.salesEntries.map(s => `
              <div style="border-bottom:1px solid var(--line); padding:6px 0; font-size:11px; display:flex; justify-content:space-between; align-items:center;">
                <span><b>${s.date}</b> | Выручка: <b>${money(s.revenue)}</b> (${s.small}м / ${s.big}б) [${s.username}]</span>
                <span>
                  <button class="btn small gold" onclick="editArchivedSale('${archive.seasonName}', '${s.id}')">Изм</button>
                  <button class="btn small red" onclick="deleteArchivedSale('${archive.seasonName}', '${s.id}')">Уд</button>
                </span>
              </div>
            `).join('')}
        </div>

        <b>Закупки (${archive.purchaseEntries ? archive.purchaseEntries.length : 0}):</b>
        <div style="max-height:150px; overflow-y:auto; margin:8px 0; background:var(--bg-2); padding:8px; border-radius:6px;">
          ${!archive.purchaseEntries || !archive.purchaseEntries.length ? '<p style="font-size:11px; color:var(--ink-soft);">Нет записей</p>' : 
            archive.purchaseEntries.map(p => `
              <div style="border-bottom:1px solid var(--line); padding:6px 0; font-size:11px; display:flex; justify-content:space-between; align-items:center;">
                <span><b>${p.date}</b> | Потрачено: <b>${money(p.cost)}</b> (+${p.small}м / +${p.big}б) [${p.username}]</span>
                <button class="btn small red" onclick="deleteArchivedPurchase('${archive.seasonName}', '${p.id}')">Уд</button>
              </div>
            `).join('')}
        </div>

        <button class="btn red small" onclick="deleteEntireArchivedSeason('${archive.seasonName}')">Удалить весь архив за ${archive.seasonName} г.</button>
      </div>
    `).join('')}
  </div>`;
}

function editArchivedSale(seasonName, saleId) {
  const season = state.archivedSeasons.find(s => s.seasonName === seasonName);
  if(!season) return;
  const item = season.salesEntries.find(x => x.id === saleId);
  if(!item) return;

  const newRev = prompt('Архив: Изменить сумму выручки (₽):', item.revenue);
  if(newRev === null) return;
  const newSm = prompt('Архив: Изменить мал. магниты:', item.small);
  const newBg = prompt('Архив: Изменить бол. магниты:', item.big);

  item.revenue = parseFloat(newRev) || 0;
  item.small = parseInt(newSm) || 0;
  item.big = parseInt(newBg) || 0;

  saveData();
  toast('Прошлогодний отчет обновлен');
}

function deleteArchivedSale(seasonName, saleId) {
  if(!confirm('Удалить эту запись из архива прошлых лет?')) return;
  const season = state.archivedSeasons.find(s => s.seasonName === seasonName);
  if(season) {
    season.salesEntries = season.salesEntries.filter(x => x.id !== saleId);
    saveData();
  }
}

function deleteArchivedPurchase(seasonName, purchaseId) {
  if(!confirm('Удалить эту закупку из архива прошлых лет?')) return;
  const season = state.archivedSeasons.find(s => s.seasonName === seasonName);
  if(season) {
    season.purchaseEntries = season.purchaseEntries.filter(x => x.id !== purchaseId);
    saveData();
  }
}

function deleteEntireArchivedSeason(seasonName) {
  const masterInput = prompt(`Внимание! Введите Мастер-пароль для удаления ВСЕГО архива за ${seasonName} год:`);
  if(masterInput !== state.masterPassword) return toast('Неверный Мастер-пароль!', true);

  state.archivedSeasons = state.archivedSeasons.filter(s => s.seasonName !== seasonName);
  saveData();
  toast(`Архив за ${seasonName} удален`);
}

/* ВЛАДЕЛЕЦ - УПРАВЛЕНИЕ СЕЗОНАМИ И СБРОС */
function renderOwnerSeasonsControlTab() {
  return `
  <div class="panel" style="border-color:var(--brass);">
    <h3>Завершение текущего сезона (${state.currentSeason})</h3>
    <p style="font-size:12px; color:var(--ink-soft);">
      Нажмите эту кнопку в конце года/сезона. Текущие отчеты о продажах и закупках сохранятся в <b>«Архив сезонов»</b>.
      Кассы точек и остатки обнулятся, и вы сможете начать новый сезон с чистого листа.
    </p>
    <div class="field">
      <label class="field-label">Название следующего сезона / года</label>
      <input type="text" id="nextSeasonName" value="${parseInt(state.currentSeason)+1 || '2027'}">
    </div>
    <button class="btn gold" onclick="finishCurrentSeason()">Завершить сезон и перенести отчеты в Архив</button>
  </div>

  <div class="panel" style="border-color:var(--red); margin-top:24px;">
    <h3 style="color:var(--red);">Сброс Данных (Требуется Мастер-пароль)</h3>
    <p style="font-size:11px; color:var(--ink-soft); margin-bottom:16px;">По умолчанию Мастер-пароль: <b>12345</b> (можно сменить в Профиле)</p>

    <div style="margin-bottom:16px; padding:12px; background:var(--bg-2); border-radius:var(--radius-sm);">
      <h4 style="margin:0 0 6px 0;">1. Сбросить отчеты за ТЕКУЩИЙ ГОД (${state.currentSeason})</h4>
      <p style="font-size:11px; color:var(--ink-soft);">Удалит все текущие продажи, закупки и обнулит кассы. Сотрудники и Прошлые Года в Архиве НЕ удалятся.</p>
      <button class="btn red" onclick="resetCurrentYearData()">Сбросить данные текущего года</button>
    </div>

    <div style="padding:12px; background:var(--bg-2); border-radius:var(--radius-sm); border:1px solid var(--red);">
      <h4 style="margin:0 0 6px 0; color:var(--red);">2. ПОЛНЫЙ СБРОС ВСЕГО (За всё время)</h4>
      <p style="font-size:11px; color:var(--ink-soft);">Полностью стирает ВСЕ продажи, закупки, фото, архив сезонов и сотрудников (останется только аккаунт Owner).</p>
      <button class="btn red" onclick="resetEverythingData()">Сбросить ВСЁ за все время</button>
    </div>
  </div>`;
}

function finishCurrentSeason() {
  const nextSeason = document.getElementById('nextSeasonName').value.trim();
  if(!nextSeason) return toast('Введите название нового сезона', true);

  if(!confirm(`Завершить текущий сезон (${state.currentSeason}) и начать Новый Сезон (${nextSeason})?`)) return;

  state.archivedSeasons.unshift({
    seasonName: state.currentSeason,
    salesEntries: [...state.salesEntries],
    purchaseEntries: [...state.purchaseEntries]
  });

  state.salesEntries = [];
  state.purchaseEntries = [];
  state.payoutRequests = [];
  state.points.forEach(p => { p.revenue = 0; p.small = 0; p.big = 0; });
  state.users.forEach(u => u.salaryBalance = 0);
  state.currentSeason = nextSeason;

  saveData();
  toast(`Сезон ${nextSeason} успешно начат!`);
}

function resetCurrentYearData() {
  const pass = prompt(`ВНИМАНИЕ! Для сброса данных за ${state.currentSeason} год введите Мастер-пароль:`);
  if(pass !== state.masterPassword) return toast('Неверный Мастер-пароль!', true);

  state.salesEntries = [];
  state.purchaseEntries = [];
  state.payoutRequests = [];
  state.points.forEach(p => { p.revenue = 0; });
  state.users.forEach(u => u.salaryBalance = 0);

  saveData();
  toast(`Отчеты за ${state.currentSeason} год сброшены`);
}

function resetEverythingData() {
  const pass = prompt('ОПАСНО! Это действие полностью очистит базу за все годы!\nВведите Мастер-пароль:');
  if(pass !== state.masterPassword) return toast('Неверный Мастер-пароль!', true);

  const curPass = state.masterPassword;
  state = defaultState();
  state.masterPassword = curPass;

  saveData();
  toast('Выполнен полный сброс системы');
}

/* ВЛАДЕЛЕЦ - БАЗА ФОТО */
function renderOwnerPhotosTab() {
  const downloadedCount = state.digitalPhotos.filter(p => p.downloaded).length;

  return `
  <div class="panel">
    <h3>Опубликовать фото для клиента</h3>
    <div class="field">
      <label class="field-label">Выберите точку</label>
      <select id="ownerUploadPoint">
        ${state.points.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label class="field-label">Код заказа</label><input type="text" id="ownerUploadCode" placeholder="например 1024"></div>
    <div class="field"><label class="field-label">Файлы фотографий</label><input type="file" id="ownerUploadFile" accept="image/*" multiple></div>
    <button class="btn blue" onclick="uploadOwnerPhoto()">Загрузить и опубликовать</button>
  </div>

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;">База загруженных фото (${state.digitalPhotos.length})</h3>
      ${downloadedCount > 0 ? `<button class="btn small red" onclick="deleteDownloadedPhotos()">Удалить все скачанные (${downloadedCount})</button>` : ''}
    </div>
    ${!state.digitalPhotos.length ? '<p style="font-size:12px; color:var(--ink-soft);">Файлы отсутствуют</p>' :
      state.digitalPhotos.map(p => {
        const pt = state.points.find(x => x.id === p.pointId);
        return `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:8px 0;">
          <div>
            <b>Код: ${p.code}</b> <span style="font-size:11px; color:var(--ink-soft);">(${pt ? pt.name : 'Точка'})</span>
            <div style="font-size:11px; color:${p.downloaded ? 'var(--green)' : 'var(--brass)'};">
              ${p.downloaded ? 'Скачано' : 'Ожидает'} | Загрузил: ${p.uploadedBy}
            </div>
          </div>
          <button class="btn small red" onclick="deleteDigitalPhoto('${p.id}')">Удалить</button>
        </div>`;
      }).join('')}
  </div>`;
}

function uploadOwnerPhoto() {
  const pointId = document.getElementById('ownerUploadPoint').value;
  uploadDigitalPhoto(pointId, 'ownerUploadCode', 'ownerUploadFile');
}

function deleteDigitalPhoto(id) {
  state.digitalPhotos = state.digitalPhotos.filter(p => p.code !== id && p.id !== id);
  saveData();
  toast('Фото удалено');
}

function deleteDownloadedPhotos() {
  const downloadedCount = state.digitalPhotos.filter(p => p.downloaded).length;
  if (!downloadedCount) return toast('Нет скачанных фото для удаления', true);

  if (confirm(`Удалить все скачанные фотографии (${downloadedCount} шт.) из базы?`)) {
    state.digitalPhotos = state.digitalPhotos.filter(p => !p.downloaded);
    saveData();
    toast(`Удалено скачанных фото: ${downloadedCount}`);
  }
}

function deleteMyDownloadedPhotos() {
  const user = currentUser();
  if(!user) return;
  
  const myDownloaded = state.digitalPhotos.filter(p => p.uploadedBy === user.username && p.downloaded);
  if (!myDownloaded.length) return toast('У вас нет скачанных фото для удаления', true);

  if (confirm(`Удалить все ваши скачанные фотографии (${myDownloaded.length} шт.)?`)) {
    state.digitalPhotos = state.digitalPhotos.filter(p => !(p.uploadedBy === user.username && p.downloaded));
    saveData();
    toast(`Удалено ваших скачанных фото: ${myDownloaded.length}`);
  }
}

function logout() {
  session.userId = null;
  session.currentTab = 'download_public';
  session.userSubTab = 'main';
  render();
}
</script>
</body>
</html>
