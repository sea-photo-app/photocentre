<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Управление Фотоцентром</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F10; --bg-2: #18181B; --surface: #1B1B1E; --surface-2: #232326;
    --ink: #F1EDE4; --ink-soft: #9C978C; --line: #2A2A2D; --line-strong: #38383C;
    --red: #C6685A; --blue: #7C9BC2; --brass: #C7A15C; --green: #7FAE8E;
    --warn-tint: rgba(199,161,92,0.14); --danger-tint: rgba(198,104,90,0.15); --radius: 12px; --radius-sm: 8px;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; min-height:100vh; font-family:'IBM Plex Sans', sans-serif; background:var(--bg); color:var(--ink); }
  button, input, select, textarea { font-family:inherit; touch-action: manipulation; }

  #root { width: 100%; max-width: 1000px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
  @media (min-width: 768px) { #root { padding-top: 16px; } }

  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .role-chip { font-size:10px; text-transform:uppercase; color:var(--brass); font-weight:600; letter-spacing:0.05em; }

  .nav-tabs { display:flex; gap:8px; overflow-x:auto; padding:12px 20px; background:var(--bg-2); border-bottom:1px solid var(--line); }
  .tab-btn { padding:8px 14px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:transparent; color:var(--ink-soft); font-size:12px; flex:none; cursor:pointer; position:relative; }
  .tab-btn.active { background:var(--brass); color:#100F0D; border-color:var(--brass); font-weight:600; }

  .content { padding:20px; }
  .stats-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .stat-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .stat-value { font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; color:var(--green); }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .field { margin-bottom:12px; }
  .field-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:6px; }
  
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea { width:100%; border:1px solid var(--line-strong); background:var(--bg-2); padding:10px 12px; font-size:14px; color:var(--ink); border-radius:var(--radius-sm); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--brass); }

  .btn { border:none; background:var(--ink); color:var(--bg); padding:10px 16px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; border-radius:var(--radius-sm); font-weight:600; width:100%; cursor:pointer; margin-top:6px; position:relative; }
  .btn.gold { background:var(--brass); color:#100F0D; }
  .btn.blue { background:var(--blue); color:#fff; }
  .btn.green { background:var(--green); color:#fff; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.outline { background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
  .btn.small { width:auto; padding:6px 12px; font-size:11px; margin:0; }

  .payout-card { border:1px solid var(--brass); background:var(--warn-tint); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; }
  .public-wrap { min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; max-width:460px; margin:0 auto; padding:20px; text-align:center; }

  /* Messenger & Chat Styles */
  .messenger-layout { display: flex; flex-direction: column; height: 500px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  @media (min-width: 600px) { .messenger-layout { flex-direction: row; } }
  
  .chat-sidebar { width: 100%; max-height: 180px; overflow-y: auto; border-bottom: 1px solid var(--line); background: var(--surface); }
  @media (min-width: 600px) { .chat-sidebar { width: 220px; max-height: 100%; border-bottom: none; border-right: 1px solid var(--line); } }
  
  .dialog-item { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .dialog-item:hover, .dialog-item.active { background: var(--surface-2); }
  .dialog-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }

  .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; }
  .chat-header { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--brass); }
  .chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-2); }
  .chat-msg { background: var(--surface-2); padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line); font-size: 13px; position: relative; max-width: 85%; align-self: flex-start; }
  .chat-msg.mine { border-color: var(--brass); background: rgba(199, 161, 92, 0.08); align-self: flex-end; }
  .chat-msg-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; gap: 8px; }
  .chat-msg-body { word-break: break-word; white-space: pre-wrap; margin-bottom: 6px; }

  .badge { position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff; font-size: 10px; font-weight: bold; border-radius: 10px; padding: 2px 5px; line-height: 1; min-width: 16px; text-align: center; }

  /* Fullscreen Image Lightbox */
  .lightbox-modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 20px; }
  .lightbox-modal.active { display: flex; }
  .lightbox-modal img { max-width: 95%; max-height: 95%; border-radius: var(--radius-sm); object-fit: contain; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
  .lightbox-close { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; font-weight: bold; }

  .copy-box { background: var(--bg-2); border: 1px dashed var(--brass); padding: 12px; border-radius: var(--radius-sm); margin-top: 12px; text-align: left; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:var(--radius-sm); font-size:13px; font-family:'IBM Plex Mono', monospace; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.show { opacity:1; }
  #toast.err { background:var(--red); color:#fff; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="root"></div>
<div id="toast"></div>

<!-- Lightbox Modal -->
<div id="lightboxModal" class="lightbox-modal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" src="" alt="Увеличенное фото">
</div>

<script>
// ==========================================
// 1. CONFIG / КЛЮЧИ
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyAWjkzWoXK3F-YTjq5qPEVLL2Li6pAoO0g",
  authDomain: "photo-center-tuapse.firebaseapp.com",
  databaseURL: "https://photo-center-tuapse-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "photo-center-tuapse",
  storageBucket: "photo-center-tuapse.firebasestorage.app",
  messagingSenderId: "633147729123",
  appId: "1:633147729123:web:04247d0657312a4301d1d6"
};

const IMGBB_API_KEY = "62e211fd034a3eb244e89ca683c7181b";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref('app_state');

// Вспомогательная функция для генерации SHA-256 хеша
async function hashString(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// Хеши по умолчанию для защиты чувствительных данных
// masterPasswordHash -> '12345'
// owner usernameHash -> 'owner'
// owner passwordHash -> '123'
const DEFAULT_MASTER_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
const DEFAULT_OWNER_USER_HASH = 'eeafbf4d9b3957b139da7b7b2e29743c6838382d61d564119d80d1a4ee8f6158';
const DEFAULT_OWNER_PASS_HASH = 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';

// ==========================================
// 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И СОСТОЯНИЕ
// ==========================================
const money = n => (Math.round(n||0)).toLocaleString('ru-RU') + ' ₽';
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowFormatted = () => new Date().toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });

function defaultState() {
  return {
    masterPasswordHash: DEFAULT_MASTER_HASH,
    currentSeason: new Date().getFullYear().toString(),
    users: [
      { id: 'owner_1', usernameHash: DEFAULT_OWNER_USER_HASH, passwordHash: DEFAULT_OWNER_PASS_HASH, role: 'owner', salaryBalance: 0 }
    ],
    points: [
      { id: 'pt_1', name: 'Главная точка', revenue: 0, small: 100, big: 100, salaryPercent: 10 }
    ],
    salesEntries: [],
    purchaseEntries: [],
    payoutRequests: [],
    digitalPhotos: [],
    archivedSeasons: [],
    chatMessages: [],
    customerRequests: []
  };
}

let state = defaultState();
let currentSearchResultHtml = ''; 
let currentSearchedCode = '';
let generatedClientText = '';
let isUploading = false; 
let expandedGroupCodes = {};

let formBuffer = {};

const savedSession = JSON.parse(localStorage.getItem('app_session') || 'null');
let session = savedSession || { 
  userId: null, 
  currentTab: 'download_public', 
  publicMode: 'download',
  ownerSubTab: 'overview', 
  userSubTab: 'main', 
  activeChatTarget: 'all',
  ownerRequestFilter: 'all'
};

// ------------------------------------------
// ЛОГИКА МАРШРУТИЗАЦИИ (URL ROUTING)
// ------------------------------------------
function updateURL() {
  const urlParams = new URLSearchParams();
  
  if (session.currentTab === 'download_public') {
    urlParams.set('page', session.publicMode || 'download');
    if (currentSearchedCode) urlParams.set('code', currentSearchedCode);
  } else if (session.currentTab === 'login') {
    urlParams.set('page', 'login');
  } else {
    const user = currentUser();
    if (user) {
      if (user.role === 'owner') {
        urlParams.set('page', session.ownerSubTab || 'overview');
      } else {
        urlParams.set('page', session.userSubTab || 'main');
      }
    }
  }

  const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
  if (window.location.search !== `?${urlParams.toString()}`) {
    window.history.pushState(null, '', newUrl);
  }
}

function parseURLAndSetSession() {
  const urlParams = new URLSearchParams(window.location.search);
  const page = urlParams.get('page');
  const code = urlParams.get('code');

  if (code) {
    currentSearchedCode = code;
  }

  if (!page || page === 'download') {
    session.currentTab = 'download_public';
    session.publicMode = 'download';
  } else if (page === 'request') {
    session.currentTab = 'download_public';
    session.publicMode = 'request';
  } else if (page === 'login') {
    session.currentTab = 'login';
  } else {
    const user = currentUser();
    if (user) {
      session.currentTab = 'main';
      if (user.role === 'owner') {
        session.ownerSubTab = page;
      } else {
        session.userSubTab = page;
      }
    } else {
      session.currentTab = 'download_public';
      session.publicMode = 'download';
    }
  }
}

window.onpopstate = () => {
  parseURLAndSetSession();
  render();
};

function saveSession() {
  localStorage.setItem('app_session', JSON.stringify(session));
  updateURL();
}

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.className = '', 2800);
}

function openLightbox(url) {
  const modal = document.getElementById('lightboxModal');
  const img = document.getElementById('lightboxImg');
  if (modal && img) {
    img.src = url;
    modal.classList.add('active');
  }
}

function closeLightbox() {
  const modal = document.getElementById('lightboxModal');
  if (modal) modal.classList.remove('active');
}

function preserveFormInputs() {
  const inputs = document.querySelectorAll('input, select, textarea');
  inputs.forEach(el => {
    if (el.id && el.type !== 'file') {
      formBuffer[el.id] = el.value;
    }
  });
}

function restoreFormInputs() {
  Object.keys(formBuffer).forEach(id => {
    const el = document.getElementById(id);
    if (el && formBuffer[id] !== undefined && formBuffer[id] !== '') {
      el.value = formBuffer[id];
    }
  });
}

dbRef.on('value', (snapshot) => {
  const data = snapshot.val();
  
  if (data && JSON.stringify(state) === JSON.stringify(data)) {
    return;
  }

  const chatChanged = data && JSON.stringify(state.chatMessages) !== JSON.stringify(data.chatMessages);

  if (data) {
    state = data;
    if (!state.masterPasswordHash) {
      state.masterPasswordHash = DEFAULT_MASTER_HASH;
    }
    if (!state.currentSeason) state.currentSeason = new Date().getFullYear().toString();
    if (!state.users) state.users = [];
    
    // Миграция старых учеток под новую схему хеширования при необходимости
    state.users.forEach(async u => {
      if (u.username && !u.usernameHash) {
        u.usernameHash = await hashString(u.username.toLowerCase());
      }
      if (u.password && !u.passwordHash) {
        u.passwordHash = await hashString(u.password);
      }
    });

    if (!state.points) state.points = [];
    if (!state.salesEntries) state.salesEntries = [];
    if (!state.purchaseEntries) state.purchaseEntries = [];
    if (!state.payoutRequests) state.payoutRequests = [];
    if (!state.digitalPhotos) state.digitalPhotos = [];
    if (!state.archivedSeasons) state.archivedSeasons = [];
    if (!state.chatMessages) state.chatMessages = [];
    if (!state.customerRequests) state.customerRequests = [];
  } else {
    state = defaultState();
    saveData();
  }

  if (isUploading) return; 

  const activeElement = document.activeElement;
  const isTyping = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA' || activeElement.tagName === 'SELECT');

  const custFile = document.getElementById('custMagnetFile');
  const empFile = document.getElementById('uploadFile');
  const ownerFile = document.getElementById('ownerUploadFile');
  const hasFiles = (custFile && custFile.files.length > 0) || 
                   (empFile && empFile.files.length > 0) || 
                   (ownerFile && ownerFile.files.length > 0);

  const custName = document.getElementById('custName');
  const custPhone = document.getElementById('custPhone');
  const hasUnsavedClientData = (custName && custName.value.trim().length > 0) || (custPhone && custPhone.value.trim().length > 0);

  if (chatChanged || (!isTyping && !hasFiles && !hasUnsavedClientData)) {
    render();
  }
});

function saveData() {
  dbRef.set(state).catch(err => {
    toast('Ошибка сохранения в Базу Данных', true);
    console.error(err);
  });
}

function currentUser() { return state.users.find(u => u.id === session.userId) || null; }

function getDisplayName(user) {
  if (!user) return '';
  if (user.role === 'owner') return 'Owner';
  return user.displayName || user.username || 'Пользователь';
}

function getUnreadChatCount(userId) {
  if (!userId) return 0;
  return state.chatMessages.filter(m => {
    const isForMe = (m.targetId === 'all' || m.targetId === userId);
    const notMine = m.senderId !== userId;
    const notRead = !m.readBy || !m.readBy.includes(userId);
    return isForMe && notMine && notRead;
  }).length;
}

function getUnreadCountForDialog(user, dialogId) {
  return state.chatMessages.filter(m => {
    const notMine = m.senderId !== user.id;
    const notRead = !m.readBy || !m.readBy.includes(user.id);
    if (dialogId === 'all') {
      return m.targetId === 'all' && notMine && notRead;
    } else {
      return (m.senderId === dialogId && m.targetId === user.id) && notRead;
    }
  }).length;
}

function markMessagesAsRead(userId, dialogTarget) {
  let updated = false;
  state.chatMessages.forEach(m => {
    const isTarget = (dialogTarget === 'all' && m.targetId === 'all') || 
                     (dialogTarget !== 'all' && ((m.senderId === dialogTarget && m.targetId === userId) || (m.senderId === userId && m.targetId === dialogTarget)));
    if (isTarget && m.senderId !== userId) {
      if (!m.readBy) m.readBy = [];
      if (!m.readBy.includes(userId)) {
        m.readBy.push(userId);
        updated = true;
      }
    }
  });
  if (updated) saveData();
}

function switchOwnerSubTab(tabName) {
  session.ownerSubTab = tabName;
  saveSession();
  render();
}

function switchUserSubTab(tabName) {
  session.userSubTab = tabName;
  saveSession();
  render();
}

function switchCurrentTab(tabName) {
  session.currentTab = tabName;
  saveSession();
  render();
}

function toggleGroupExpand(code) {
  expandedGroupCodes[code] = !expandedGroupCodes[code];
  render();
}

function logout() {
  session.userId = null;
  session.currentTab = 'download_public';
  session.publicMode = 'download';
  saveSession();
  render();
}

function render() {
  preserveFormInputs();
  const scrollPos = window.scrollY;
  const root = document.getElementById('root');
  const user = currentUser();

  if (session.currentTab === 'download_public') {
    root.innerHTML = renderPublicDownloadPage();
    restoreFormInputs();
    if (currentSearchedCode && session.publicMode === 'download' && !currentSearchResultHtml) {
      searchPhotoByCode();
    }
    window.scrollTo(0, scrollPos);
    return;
  }

  if (!user || session.currentTab === 'login') {
    root.innerHTML = renderAuthPage();
    restoreFormInputs();
    window.scrollTo(0, scrollPos);
    return;
  }

  if (user.role === 'owner') root.innerHTML = renderOwnerDashboard(user);
  else if (user.role === 'employee') root.innerHTML = renderEmployeeDashboard(user);
  else if (user.role === 'buyer') root.innerHTML = renderBuyerDashboard(user);

  restoreFormInputs();
  window.scrollTo(0, scrollPos);
}

/* PUBLIC DOWNLOAD & REQUEST PAGE */
function renderPublicDownloadPage() {
  const mode = session.publicMode || 'request';

  return `
  <div class="public-wrap fade-in">
    <div style="display:flex; gap:8px; width:100%; margin-bottom:16px;">
      <button class="btn ${mode === 'request' ? 'gold' : 'outline'}" onclick="session.publicMode='request'; saveSession(); render();">Оформить заявку</button>
      <button class="btn ${mode === 'download' ? 'gold' : 'outline'}" onclick="session.publicMode='download'; saveSession(); render();">Скачать фото</button>
    </div>

    ${mode === 'request' ? `
      <h2>Получить фотографии</h2>
      <p style="color:var(--ink-soft); font-size:13px;">Выберите точку покупки, заполните данные и сфотографируйте магнит</p>
      
      <div class="panel" style="width:100%; text-align:left;">
        <div class="field">
          <label class="field-label">Точка, где вы покупали</label>
          <select id="custPointId" onchange="formBuffer['custPointId']=this.value">
            <option value="">-- Выберите точку --</option>
            ${state.points.map(pt => `<option value="${pt.id}">${pt.name}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Ваше Имя</label>
          <input type="text" id="custName" placeholder="Иван" oninput="formBuffer['custName']=this.value">
        </div>
        <div class="field">
          <label class="field-label">Номер телефона</label>
          <input type="text" id="custPhone" placeholder="+7 900 000 00 00" oninput="formBuffer['custPhone']=this.value">
        </div>
        <div class="field">
          <label class="field-label">Фотография магнита</label>
          <input type="file" id="custMagnetFile" accept="image/*">
        </div>
        <button class="btn gold" onclick="submitCustomerRequest()">Отправить заявку продавцу</button>
      </div>
    ` : `
      <h2>Скачать Фотографии</h2>
      <p style="color:var(--ink-soft); font-size:13px;">Введите код заказа для получения фотографий</p>
      <div style="width:100%; margin:16px 0;">
        <input type="text" id="photoCodeInput" value="${currentSearchedCode}" placeholder="Код заказа (например 1024)" style="text-align:center; font-size:18px;" oninput="formBuffer['photoCodeInput']=this.value">
        <button class="btn gold" onclick="searchPhotoByCode()">Найти фото</button>
      </div>
      <div id="photoSearchResult" style="width:100%;">${currentSearchResultHtml}</div>
    `}

    <div style="margin-top:24px; font-size:13px; color:var(--ink-soft); background:var(--surface); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--line); width:100%;">
      Возникли проблемы или ошибки?<br>
      Обратная связь: <a href="tel:+79256860074" style="color:var(--brass); text-decoration:none; font-weight:600;">+7 925 686 00 74</a>
    </div>
    <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:20px; width:100%;">
      <button class="btn outline" onclick="switchCurrentTab('login')">Вход для персонала</button>
    </div>
  </div>`;
}

async function submitCustomerRequest() {
  const pointId = document.getElementById('custPointId').value;
  const nameInput = document.getElementById('custName');
  const phoneInput = document.getElementById('custPhone');
  const fileInput = document.getElementById('custMagnetFile');
  
  const name = nameInput ? nameInput.value.trim() : '';
  const phone = phoneInput ? phoneInput.value.trim() : '';
  const file = fileInput ? fileInput.files[0] : null;

  if(!pointId) return toast('Выберите точку, где делали покупку', true);
  if(!name || !phone || !file) return toast('Заполните имя, телефон и выберите фото магнита', true);

  toast('Загрузка снимка...');

  const formData = new FormData();
  formData.append('image', file);

  try {
    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    const result = await response.json();

    if(result.success) {
      state.customerRequests.unshift({
        id: uid(),
        pointId,
        name,
        phone,
        magnetUrl: result.data.url,
        date: nowFormatted(),
        status: 'pending'
      });
      
      delete formBuffer['custName'];
      delete formBuffer['custPhone'];
      delete formBuffer['custPointId'];

      if (nameInput) nameInput.value = '';
      if (phoneInput) phoneInput.value = '';
      if (fileInput) fileInput.value = '';

      saveData();
      alert('Заявка успешно отправлена! Продавец этой точки уже обрабатывает её.');
      session.publicMode = 'download';
      saveSession();
      render();
    } else {
      toast('Ошибка загрузки фото', true);
    }
  } catch(e) {
    toast('Ошибка сети при загрузке', true);
  }
}

function rejectCustomerRequest(requestId) {
  if (confirm('Отклонить эту заявку от клиента?')) {
    const req = state.customerRequests.find(r => r.id === requestId);
    if (req) {
      req.status = 'rejected';
      saveData();
      toast('Заявка отклонена');
    }
  }
}

function searchPhotoByCode() {
  const codeInput = document.getElementById('photoCodeInput');
  const code = codeInput ? codeInput.value.trim() : currentSearchedCode;
  const res = document.getElementById('photoSearchResult');
  if(!code) return toast('Введите код', true);

  currentSearchedCode = code;
  updateURL();

  const photos = state.digitalPhotos.filter(p => p.code === code);
  if(!photos.length) {
    currentSearchResultHtml = `<p style="color:var(--red); margin-top:12px;">Фотографии не найдены</p>`;
    if (res) res.innerHTML = currentSearchResultHtml;
    return;
  }

  currentSearchResultHtml = `
    <div style="margin-top:16px; width:100%;">
      <p style="font-size:13px; color:var(--green); font-weight:600; margin-bottom:12px;">Найдено снимков: ${photos.length}</p>
      ${photos.map((p, idx) => `
        <div class="panel fade-in" style="margin-bottom:12px; text-align:left;">
          <img src="${p.photoUrl}" style="width:100%; border-radius:var(--radius-sm); margin-bottom:10px; cursor:pointer;" onclick="openLightbox('${p.photoUrl}')">
          <button class="btn green" onclick="downloadPhotoFile('${p.id}', '${p.photoUrl}', 'Photo_${p.code}_${idx+1}.jpg')">Скачать фото №${idx+1}</button>
        </div>
      `).join('')}
    </div>
  `;

  if (res) res.innerHTML = currentSearchResultHtml;
}

async function downloadPhotoFile(photoId, photoUrl, fileName) {
  toast('Скачивание файла...');
  
  const photo = state.digitalPhotos.find(p => p.id === photoId);
  if (photo) {
    photo.downloaded = true;
    saveData();
  }

  try {
    const response = await fetch(photoUrl);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = blobUrl;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
    toast('Файл сохранен!');
  } catch (err) {
    console.error(err);
    const link = document.createElement('a');
    link.href = photoUrl;
    link.download = fileName;
    link.target = '_blank';
    link.click();
  }
}

async function handleLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  
  if (!u || !p) return toast('Введите логин и пароль', true);

  const inputUserHash = await hashString(u.toLowerCase());
  const inputPassHash = await hashString(p);

  const user = state.users.find(x => {
    const matchUser = x.usernameHash ? x.usernameHash === inputUserHash : (x.username && x.username.toLowerCase() === u.toLowerCase());
    const matchPass = x.passwordHash ? x.passwordHash === inputPassHash : (x.password === p);
    return matchUser && matchPass;
  });
  
  if(!user) return toast('Неверный логин или пароль', true);
  
  session.userId = user.id;
  session.currentTab = 'main';
  session.userSubTab = 'main';
  session.ownerSubTab = 'overview';
  saveSession();
  render();
}

            <div>
              <b>${getDisplayName(u)}</b>
              <div style="font-size:10px; color:var(--ink-soft);">${roleTitle}</div>
            </div>
            ${unread > 0 ? `<span class="dialog-badge">${unread}</span>` : ''}
          </div>`;
        }).join('')}
      </div>

      <!-- Main Chat Area -->
      <div class="chat-main">
        <div class="chat-header">
          ${targetId === 'all' ? '📢 Общий чат' : `💬 Переписка с ${activeDialogUser ? getDisplayName(activeDialogUser) : ''}`}
        </div>

        <div class="chat-box" id="chatBox">
          ${!visibleMessages.length ? '<p style="font-size:12px; color:var(--ink-soft); text-align:center; margin:auto;">Сообщений пока нет</p>' :
            visibleMessages.map(m => {
              const isMine = m.senderId === user.id;
              const isOwner = user.role === 'owner';

              return `
              <div class="chat-msg ${isMine ? 'mine' : ''}">
                <div class="chat-msg-header">
                  <b>${m.senderName}</b>

          <textarea id="chatInputText" rows="2" placeholder="Напишите сообщение..." style="resize:none;" oninput="formBuffer['chatInputText']=this.value"></textarea>
          <button class="btn gold" style="width:100px; margin:0;" onclick="sendChatMessage()">Отправить</button>
        </div>
      </div>
    </div>
  </div>`;
}

function sendChatMessage() {
  const textInput = document.getElementById('chatInputText');
  const text = textInput ? textInput.value.trim() : '';
  if (!text) return toast('Введите текст сообщения', true);

  const user = currentUser();
  const targetId = session.activeChatTarget || 'all';

  state.chatMessages.push({
    id: uid(),
    senderId: user.id,
    senderName: getDisplayName(user),
    targetId: targetId,
    text: text,
    time: nowFormatted(),
    readBy: [user.id]
  });

  delete formBuffer['chatInputText'];
  saveData();
  if (textInput) textInput.value = '';
}

function deleteChatMessage(msgId) {
  const user = currentUser();
  const msg = state.chatMessages.find(m => m.id === msgId);
  if (!msg) return;

  if (user.role === 'owner' || msg.senderId === user.id) {
    if (confirm('Удалить это сообщение?')) {
      state.chatMessages = state.chatMessages.filter(m => m.id !== msgId);
      saveData();
      toast('Сообщение удалено');
    }
  } else {
    toast('У вас нет прав на удаление этого сообщения', true);
  }
}

async function changeMyPassword() {
  const curr = document.getElementById('currPassword').value;
  const newP = document.getElementById('newPassword').value;
  const confP = document.getElementById('confirmPassword').value;

  const user = currentUser();
  if(!curr || !newP || !confP) return toast('Заполните все поля', true);
  
  const currHash = await hashString(curr);
  const matchPass = user.passwordHash ? user.passwordHash === currHash : (user.password === curr);
  if(!matchPass) return toast('Неверный текущий пароль', true);
  if(newP !== confP) return toast('Новые пароли не совпадают', true);

  user.passwordHash = await hashString(newP);
  delete user.password; // Удаляем открытый пароль если был
  saveData();
  toast('Пароль аккаунта изменён!');
}

async function changeMasterPassword() {
  const curr = document.getElementById('currMasterPass').value;
  const newP = document.getElementById('newPassword').value;

  const currHash = await hashString(curr);
  const matchMaster = state.masterPasswordHash ? state.masterPasswordHash === currHash : (state.masterPassword === curr);
  
  if(!matchMaster) return toast('Неверный текущий мастер-пароль', true);
  if(!newP || newP.length < 3) return toast('Пароль слишком короткий', true);

  state.masterPasswordHash = await hashString(newP);
  delete state.masterPassword; // Удаляем открытый мастер-пароль если был
  saveData();
  toast('Мастер-пароль сброса изменен!');
}

function groupPhotosByCode(photos) {
  const groups = {};
  photos.forEach(p => {
    if (!groups[p.code]) {
      groups[p.code] = {
        code: p.code,
        phone: p.phone || '',
        pointId: p.pointId,
        uploadedBy: p.uploadedBy,
        items: []
      };
    }
    groups[p.code].items.push(p);
  });
  return Object.values(groups);
}

function toggleClientTextVisibility(elementId) {
  const el = document.getElementById(elementId);
  if (el) {
    el.style.display = (el.style.display === 'none' || !el.style.display) ? 'block' : 'none';
  }
}

function copyClientTextCustom(elementId) {
  const text = document.getElementById(elementId).innerText;
  navigator.clipboard.writeText(text);
  toast('Текст скопирован!');
}

function deletePhotoGroup(code) {
  const groupPhotos = state.digitalPhotos.filter(p => p.code === code);
  const downloadedCount = groupPhotos.filter(p => p.downloaded).length;

  if (downloadedCount < groupPhotos.length) {
    return alert('Удалить заказ невозможно! Покупатель еще не скачал все фотографии из этого заказа.');
  }

  if (confirm(`Удалить полностью заказ "${code}" (${groupPhotos.length} фото)?`)) {
    state.digitalPhotos = state.digitalPhotos.filter(p => p.code !== code);
    saveData();
    toast(`Заказ ${code} удален!`);
  }
}

function fillUploadCodeFromRequest(requestId) {
  const req = state.customerRequests.find(r => r.id === requestId);
  if(!req) return;

  const randomCode = Math.floor(1000 + Math.random() * 9000).toString();

  req.currentAssignedCode = randomCode;
  req.status = 'processing';
  session.activeCustomerRequest = req;

  saveData();

  const user = currentUser();
  if (user && user.role === 'owner') {
    session.ownerSubTab = 'photos';
    saveSession();
    render();
    setTimeout(() => {
      const input = document.getElementById('ownerUploadCode');
      const pointSelect = document.getElementById('ownerUploadPoint');
      if(input) {
        input.value = randomCode;
        formBuffer['ownerUploadCode'] = randomCode;
      }
      if(pointSelect && req.pointId) {
        pointSelect.value = req.pointId;
        formBuffer['ownerUploadPoint'] = req.pointId;
      }
      if(input) input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  } else {
    const input = document.getElementById('uploadCode');
    if(input) {
      input.value = randomCode;
      formBuffer['uploadCode'] = randomCode;
    }
  }

  toast(`Присвоен номер ${randomCode}. Загрузите фотографии.`);
}

function generateRandomCode(inputId) {
  const code = Math.floor(1000 + Math.random() * 9000).toString();
  const el = document.getElementById(inputId);
  if(el) {
    el.value = code;
    formBuffer[inputId] = code;
  }
}

function copyClientText() {
  const text = document.getElementById('textToCopy').innerText;
  navigator.clipboard.writeText(text);
  toast('Текст скопирован!');
}

function submitEmployeeReport(pointId) {
  const reportDate = document.getElementById('empDate').value || todayStr();
  const rev = parseFloat(document.getElementById('empRev').value) || 0;
  const small = parseInt(document.getElementById('empSm').value) || 0;
  const big = parseInt(document.getElementById('empBg').value) || 0;
  if(rev <= 0) return toast('Введите корректную выручку', true);

  const point = state.points.find(p => p.id === pointId);
  const user = currentUser();

  point.revenue += rev;
  point.small = Math.max(0, point.small - small);
  point.big = Math.max(0, point.big - big);

  const earned = Math.round(rev * ((point.salaryPercent || 0) / 100));
  user.salaryBalance = (user.salaryBalance || 0) + earned;

  state.salesEntries.unshift({ id: uid(), pointId, date: reportDate, small, big, revenue: rev, userId: user.id, username: getDisplayName(user), season: state.currentSeason });
  
  delete formBuffer['empRev'];
  delete formBuffer['empSm'];
  delete formBuffer['empBg'];

  saveData();

  if(confirm(`Отчет принят за ${reportDate}. Начислено: ${earned} ₽. Запросить выплату прямо сейчас?`)) {
    const customAmountStr = prompt(`Укажите сумму для выплаты (Доступный баланс: ${user.salaryBalance} ₽):`, earned);
    const amountToReq = parseFloat(customAmountStr);
    
    if (amountToReq && amountToReq > 0) {
      if (amountToReq > user.salaryBalance) {
        toast('Запрошенная сумма превышает доступный баланс!', true);
      } else {
        state.payoutRequests.unshift({ id: uid(), userId: user.id, username: getDisplayName(user), amount: amountToReq, type: 'Выплата за день', date: reportDate, status: 'pending' });
        saveData();
        toast('Запрос на выплату отправлен!');
      }
    }
  } else {
    toast('Отчет сохранен!');
  }
}

function requestCustomBalancePayout(userId) {
  const u = currentUser();
  const amountInput = parseFloat(document.getElementById('empPayoutAmount').value);

  if(!u.salaryBalance || u.salaryBalance <= 0) return toast('Баланс пуст', true);
  if(!amountInput || amountInput <= 0) return toast('Введите корректную сумму', true);
  if(amountInput > u.salaryBalance) return toast('Запрошенная сумма превышает Ваш баланс', true);
  
  state.payoutRequests.unshift({ id: uid(), userId, username: getDisplayName(u), amount: amountInput, type: 'Вывод средств', date: todayStr(), status: 'pending' });
  saveData();
  toast(`Отправлен запрос на вывод: ${money(amountInput)}`);
}

/* ЗАГРУЗКА ФОТО ЧЕРЕЗ IMGBB API */
async function uploadDigitalPhoto(pointId, codeInputId, fileInputId) {
  const code = document.getElementById(codeInputId).value.trim();
  const fileInput = document.getElementById(fileInputId);
  const files = Array.from(fileInput ? fileInput.files || [] : []);

  if(!code || !files.length) return toast('Укажите код и выберите файлы', true);

  const isCodeExists = state.digitalPhotos.some(p => p.code === code);
  if(isCodeExists) {
    alert(`Ошибка! Заказ с номером "${code}" уже существует в базе.\nПожалуйста, смените номер заказа.`);
    toast(`Номер "${code}" уже существует! Смените номер.`, true);
    return;
  }

  isUploading = true; 
  toast(`Загрузка ${files.length} фото на ImgBB...`);

  let loadedCount = 0;
  const activeReq = session.activeCustomerRequest;
  const phone = activeReq ? activeReq.phone : '';

  for (const file of files) {
    const formData = new FormData();
    formData.append('image', file);

    try {
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });
      const result = await response.json();

      if (result.success) {
        state.digitalPhotos.unshift({
          id: uid(),
          code,
          phone: phone,
          photoUrl: result.data.url,
          uploadedBy: getDisplayName(currentUser()),
          pointId,
          downloaded: false,
          createdAt: Date.now()
        });
        loadedCount++;
      } else {
        toast(`Ошибка загрузки одного из файлов`, true);
      }
    } catch (err) {
      console.error(err);
      toast('Сетевая ошибка при загрузке', true);
    }
  }

  isUploading = false; 

  if (loadedCount > 0) {
    const baseUrl = window.location.origin + window.location.pathname;
    const directLink = `${baseUrl}?page=download&code=${code}`;

    if (activeReq) {
      generatedClientText = `Здравствуйте, ${activeReq.name}! Ваш заказ готов 🎉\n\nНомер вашего заказа: ${code}\nДля скачивания перейдите по ссылке:\n${directLink}`;
      
      const reqInState = state.customerRequests.find(r => r.id === activeReq.id);
      if(reqInState) reqInState.status = 'completed';
      session.activeCustomerRequest = null;
    } else {
      generatedClientText = `Здравствуйте! Ваши фотографии готовы 🎉\n\nНомер вашего заказа: ${code}\nПерейдите по ссылке для скачивания:\n${directLink}`;
    }

    delete formBuffer[codeInputId];
    saveData();
    render();
    toast(`Успешно загружено фото: ${loadedCount}`);
  }
}

function submitOwnerReport() {
  const pointId = document.getElementById('ownerReportPoint').value;
  const reportDate = document.getElementById('ownerReportDate').value || todayStr();
  const rev = parseFloat(document.getElementById('ownerReportRev').value) || 0;
  const small = parseInt(document.getElementById('ownerReportSm').value) || 0;
  const big = parseInt(document.getElementById('ownerReportBg').value) || 0;

  if(!pointId || rev <= 0) return toast('Укажите точку и выручку', true);

  const point = state.points.find(p => p.id === pointId);
  point.revenue += rev;
  point.small = Math.max(0, point.small - small);
  point.big = Math.max(0, point.big - big);

  state.salesEntries.unshift({
    id: uid(), pointId, date: reportDate, small, big, revenue: rev, userId: currentUser().id, username: 'Владелец (Owner)', season: state.currentSeason
  });

  delete formBuffer['ownerReportRev'];
  delete formBuffer['ownerReportSm'];
  delete formBuffer['ownerReportBg'];

  saveData();
  toast('Отчет зафиксирован');
}

async function resetUserPasswordPrompt(userId) {
  const u = state.users.find(x => x.id === userId);
  const newPass = prompt(`Новый пароль для ${getDisplayName(u)}:`);
  if(!newPass) return;
  u.passwordHash = await hashString(newPass);
  delete u.password;
  saveData();
  toast(`Пароль для ${getDisplayName(u)} изменен`);
}

function adjustBalancePrompt(userId, action) {
  const u = state.users.find(x => x.id === userId);
  const amountStr = prompt(action === 'add' ? 'Сумма премии (₽):' : 'Сумма списания (₽):');
  const amount = parseFloat(amountStr);
  if(!amount || amount <= 0) return;

  if(action === 'add') u.salaryBalance = (u.salaryBalance || 0) + amount;
  else u.salaryBalance = Math.max(0, (u.salaryBalance || 0) - amount);

  saveData();
}

function renderPointAssignmentSelector(user) {
  return state.points.map(p => {
    const checked = user.assignedPoints && user.assignedPoints.includes(p.id);
    return `<label style="display:inline-block; margin-right:10px; font-size:12px;">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleUserPoint('${user.id}', '${p.id}', this.checked)"> ${p.name}
    </label>`;
  }).join('');
}

function toggleUserPoint(userId, pointId, isChecked) {
  const u = state.users.find(x => x.id === userId);
  if(!u.assignedPoints) u.assignedPoints = [];
  if(isChecked) {
    if(!u.assignedPoints.includes(pointId)) u.assignedPoints.push(pointId);
  } else {
    u.assignedPoints = u.assignedPoints.filter(id => id !== pointId);
  }
  saveData();
}

function updateUserRole(userId, role) {
  const u = state.users.find(x => x.id === userId);
  u.role = role;
  saveData();
}

function manualClearBalance(userId) {
  const u = state.users.find(x => x.id === userId);
  if(confirm(`Обнулить баланс ${money(u.salaryBalance||0)} сотрудника ${getDisplayName(u)}?`)) {
    u.salaryBalance = 0;
    saveData();
  }
}

function approvePayout(requestId) {
  const req = state.payoutRequests.find(r => r.id === requestId);
  if (!req) return;
  const user = state.users.find(u => u.id === req.userId);
  if (confirm(`Выплатить ${money(req.amount)}?`)) {
    if(user) user.salaryBalance = Math.max(0, (user.salaryBalance || 0) - req.amount);
    state.payoutRequests = state.payoutRequests.filter(r => r.id !== requestId);
    saveData();
  }
}

function rejectPayout(requestId) {
  if (confirm(`Отклонить запрос?`)) {
    state.payoutRequests = state.payoutRequests.filter(r => r.id !== requestId);
    saveData();
  }
}

async function addNewUser() {
  const u = prompt('Логин сотрудника:');
  const p = prompt('Пароль:');
  if(!u || !p) return;
  
  const usernameHash = await hashString(u.toLowerCase());
  const passwordHash = await hashString(p);
  
  state.users.push({ 
    id: uid(), 
    displayName: u,
    usernameHash, 
    passwordHash, 
    role: 'employee', 
    assignedPoints: [], 
    salaryBalance: 0 
  });
  saveData();
}

function deleteUser(id) {
  if(confirm('Удалить сотрудника?')) {
    state.users = state.users.filter(u => u.id !== id);
    saveData();
  }
}

function editArchivedSale(seasonName, saleId) {
  const season = state.archivedSeasons.find(s => s.seasonName === seasonName);

  if(!item) return;

  const newRev = prompt('Архив: Изменить сумму выручки (₽):', item.revenue);
  if(newRev === null) return;
  const newSm = prompt('Архив: Изменить мал. магниты:', item.small);
  const newBg = prompt('Архив: Изменить бол. магниты:', item.big);

  item.revenue = parseFloat(newRev) || 0;
  item.small = parseInt(newSm) || 0;
  item.big = parseInt(newBg) || 0;

  saveData();
  toast('Прошлогодний отчет обновлен');
}

function deleteArchivedSale(seasonName, saleId) {
  if(!confirm('Удалить эту запись из архива прошлых лет?')) return;
  const season = state.archivedSeasons.find(s => s.seasonName === seasonName);

    season.salesEntries = season.salesEntries.filter(x => x.id !== saleId);

function deleteArchivedPurchase(seasonName, purchaseId) {
  if(!confirm('Удалить эту закупку из архива прошлых лет?')) return;
  const season = state.archivedSeasons.find(s => s.seasonName === seasonName);
  if(season) {
    season.purchaseEntries = season.purchaseEntries.filter(x => x.id !== purchaseId);
    saveData();

async function deleteEntireArchivedSeason(seasonName) {
  const masterInput = prompt(`Внимание! Введите Мастер-пароль для удаления ВСЕГО архива за ${seasonName} год:`);
  if (!masterInput) return;
  
  const inputHash = await hashString(masterInput);
  const matchMaster = state.masterPasswordHash ? state.masterPasswordHash === inputHash : (state.masterPassword === masterInput);

  if (!matchMaster) return toast('Неверный Мастер-пароль!', true);

  state.archivedSeasons = state.archivedSeasons.filter(s => s.seasonName !== seasonName);
  saveData();
  toast(`Архив за ${seasonName} удален`);
}

function finishCurrentSeason() {
  const nextSeason = document.getElementById('nextSeasonName').value.trim();
  if(!nextSeason) return toast('Введите название нового сезона', true);

  if(!confirm(`Завершить текущий сезон (${state.currentSeason}) и начать Новый Сезон (${nextSeason})?`)) return;

  state.archivedSeasons.unshift({
    seasonName: state.currentSeason,
    salesEntries: [...state.salesEntries],
    purchaseEntries: [...state.purchaseEntries]
  });

  state.salesEntries = [];
  state.purchaseEntries = [];
  state.payoutRequests = [];
  state.points.forEach(p => { p.revenue = 0; p.small = 0; p.big = 0; });
  state.users.forEach(u => u.salaryBalance = 0);
  state.currentSeason = nextSeason;

  saveData();
  toast(`Сезон ${nextSeason} успешно начат!`);
}

async function resetCurrentYearData() {
  const pass = prompt(`ВНИМАНИЕ! Для сброса данных за ${state.currentSeason} год введите Мастер-пароль:`);
  if (!pass) return;

  const inputHash = await hashString(pass);
  const matchMaster = state.masterPasswordHash ? state.masterPasswordHash === inputHash : (state.masterPassword === pass);

  if (!matchMaster) return toast('Неверный Мастер-пароль!', true);

  state.salesEntries = [];
  state.purchaseEntries = [];
  state.payoutRequests = [];
  state.points.forEach(p => { p.revenue = 0; p.small = 0; p.big = 0; });
  state.users.forEach(u => u.salaryBalance = 0);

  saveData();
  toast(`Данные за ${state.currentSeason} год сброшены!`);
}

async function resetEverythingData() {
  const pass = prompt(`ОПАСНОСТЬ! Для ПОЛНОГО ОБНУЛЕНИЯ ВСЕЙ БАЗЫ ДАННЫХ введите Мастер-пароль:`);
  if (!pass) return;

  const inputHash = await hashString(pass);
  const matchMaster = state.masterPasswordHash ? state.masterPasswordHash === inputHash : (state.masterPassword === pass);

  if (!matchMaster) return toast('Неверный Мастер-пароль!', true);

  state = defaultState();
  saveData();
  toast('Все данные приложения полностью сброшены!');
}

// Инициализация стартовой страницы из URL
parseURLAndSetSession();
render();
</script>
