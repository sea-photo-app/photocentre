<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Учёт точек и фотоцентр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F10; --bg-2:#18181B; --surface:#1B1B1E; --surface-2:#232326;
    --ink:#F1EDE4; --ink-soft:#9C978C; --line:#2A2A2D; --line-strong:#38383C;
    --red:#C6685A; --red-dark:#E08B7C; --blue:#7C9BC2; --brass:#C7A15C;
    --brass-light:#DFBD82; --green:#7FAE8E; --green-light:#9BC7AA;
    --danger-tint: rgba(198,104,90,0.14); --warn-tint: rgba(199,161,92,0.14);
    --success-tint: rgba(127,174,142,0.18); --on-btn:#100F0D;
    --radius:14px; --radius-sm:9px; --shadow: 0 12px 32px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
  html[data-theme="light"]{
    --bg:#F3EFE6; --bg-2:#EAE3D3; --surface:#FBF9F4; --surface-2:#F2EDE1;
    --ink:#221F1A; --ink-soft:#726B5E; --line:#E2DACA; --line-strong:#CFC3AA;
    --red:#AD4A3B; --red-dark:#8F332C; --blue:#3E5F8C; --brass:#9C7530;
    --brass-light:#B68F42; --green:#3E7A54; --green-light:#4E9268;
    --danger-tint: rgba(173,74,59,0.09); --warn-tint: rgba(156,117,48,0.10);
    --success-tint: rgba(62,122,84,0.12); --on-btn:#FBF9F4;
    --shadow: 0 8px 24px -12px rgba(40,32,16,0.18);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; min-height:100vh; font-family:'IBM Plex Sans', sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button, input, select { font-family:inherit; touch-action: manipulation; }
  button { cursor:pointer; }

  /* App Layout & Desktop Adaptivity */
  #root { width: 100%; max-width: 900px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }
  @media (min-width: 768px) {
    #root { padding-top: 20px; }
    .stats-grid { grid-template-columns: repeat(3, 1fr) !important; }
    .edit-grid { grid-template-columns: repeat(2, 1fr); }
    .bottom-nav { border-radius: var(--radius); margin-bottom: 12px; }
  }

  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  /* Header & Navigation */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .topbar .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { font-family:'Fraunces', serif; font-size:18px; margin:0; color:var(--ink); }
  .role-chip { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--brass); font-weight:600; }
  .topbar-right { display:flex; align-items:center; gap:10px; }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:900px; display:flex; background:var(--surface); border-top:1px solid var(--line); z-index:30; }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 4px; background:none; border:none; color:var(--ink-soft); font-size:10px; text-transform:uppercase; letter-spacing:0.05em; position:relative; }
  .nav-item.active { color:var(--brass); font-weight:600; }
  .nav-dot { position:absolute; top:8px; right:30%; width:7px; height:7px; border-radius:50%; background:var(--red); }

  /* Content Components */
  .content { padding:20px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .stats-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:20px; }
  .stat-card { background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .stat-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .stat-value { font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; color:var(--green); }
  
  /* Controls & Forms */
  .field { margin-bottom:12px; }
  .field-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:6px; letter-spacing:0.05em; }
  input[type=text], input[type=password], input[type=number], input[type=date], select { width:100%; border:1px solid var(--line-strong); background:var(--bg-2); padding:12px; font-size:15px; color:var(--ink); border-radius:var(--radius-sm); outline:none; }
  input:focus, select:focus { border-color:var(--brass); }
  
  .btn { border:none; background:var(--ink); color:var(--bg); padding:12px 16px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; border-radius:var(--radius-sm); font-weight:600; width:100%; margin-top:8px; transition:opacity .15s; }
  .btn:active { opacity:0.85; }
  .btn.gold { background:var(--brass); color:var(--on-btn); }
  .btn.blue { background:var(--blue); color:#fff; }
  .btn.green { background:var(--green); color:#fff; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.outline { background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
  .btn.small { width:auto; padding:6px 12px; font-size:11px; margin:0; }

  /* Public Download Page UI */
  .public-wrap { min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; max-width:420px; margin:0 auto; padding:20px; text-align:center; }
  .photo-download-card { width:100%; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:16px; margin-top:16px; text-align:left; }
  .photo-download-card img { width:100%; height:220px; object-fit:cover; border-radius:var(--radius-sm); margin-bottom:12px; }

  /* Point Chips & List items */
  .point-select { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:14px; }
  .point-chip { padding:8px 14px; border:1px solid var(--line-strong); border-radius:var(--radius); background:transparent; color:var(--ink-soft); font-size:12px; flex:none; }
  .point-chip.active { background:var(--brass); color:var(--on-btn); border-color:var(--brass); font-weight:600; }
  .user-row { border:1px solid var(--line); border-radius:var(--radius); padding:14px; background:var(--surface); margin-bottom:10px; }
  .payout-card { border:1px solid var(--brass); background:var(--warn-tint); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; }

  #toast { position:fixed; bottom:85px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:var(--radius-sm); font-size:13px; font-family:'IBM Plex Mono', monospace; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.show { opacity:1; }
  #toast.err { background:var(--red); color:#fff; }
</style>
</head>
<body>

<div id="root"><div style="text-align:center; padding:50px; color:var(--ink-soft);">Загрузка системы...</div></div>
<div id="toast"></div>

<script>
const STORE_KEY = 'photo_magnet_app_v2';
const money = n => (Math.round(n||0)).toLocaleString('ru-RU') + ' ₽';
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().slice(0, 10);

function defaultState() {
  return {
    users: [
      { id: 'owner_1', username: 'Owner', password: '123', role: 'owner', status: 'approved', salaryBalance: 0 }
    ],
    points: [
      { id: 'pt_1', name: 'Центральная точка', revenue: 0, small: 50, big: 50, salaryPercent: 10 }
    ],
    salesEntries: [],
    purchaseEntries: [],
    payoutRequests: [], // { id, userId, username, amount, type, date, status }
    digitalPhotos: []   // { id, code, photoUrl, uploadedBy, pointId, downloaded: false, createdAt }
  };
}

let state = null;
let session = { userId: null, currentTab: 'download_public' };

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.className = '', 2800);
}

/* LocalStorage Engine */
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  } catch(e) { state = defaultState(); }
}
function saveData() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ toast('Ошибка записи данных', true); }
}

function currentUser() { return state.users.find(u => u.id === session.userId) || null; }

/* RENDER LOGIC */
function render() {
  const root = document.getElementById('root');
  const user = currentUser();

  if (session.currentTab === 'download_public') {
    root.innerHTML = renderPublicDownloadPage();
    return;
  }

  if (!user) {
    root.innerHTML = renderAuthPage();
    return;
  }

  if (user.role === 'owner') root.innerHTML = renderOwnerDashboard(user);
  else if (user.role === 'employee') root.innerHTML = renderEmployeeDashboard(user);
  else if (user.role === 'buyer') root.innerHTML = renderBuyerDashboard(user);
}

/* 1. PUBLIC DOWNLOAD PAGE */
function renderPublicDownloadPage() {
  return `
  <div class="public-wrap fade-in">
    <h1 style="font-family:'Fraunces',serif; margin-bottom:6px;">Получение Фотографий</h1>
    <p style="color:var(--ink-soft); font-size:13px; margin-top:0;">Введите код заказа, предоставленный продавцом</p>
    <div style="width:100%; margin-top:14px;">
      <input type="text" id="photoCodeInput" placeholder="Например: 1024" style="text-align:center; font-size:20px; font-weight:600; letter-spacing:0.1em;">
      <button class="btn gold" onclick="searchPhotoByCode()">Найти фото</button>
    </div>
    <div id="photoSearchResult"></div>
    <div style="margin-top:30px; border-top:1px solid var(--line); padding-top:20px; width:100%;">
      <button class="btn outline" onclick="session.currentTab = 'login'; render();">Вход для сотрудников</button>
    </div>
  </div>`;
}

function searchPhotoByCode() {
  const code = document.getElementById('photoCodeInput').value.trim();
  const resContainer = document.getElementById('photoSearchResult');
  if(!code) { toast('Введите код', true); return; }

  const photos = state.digitalPhotos.filter(p => p.code === code);
  if(!photos.length) {
    resContainer.innerHTML = `<p style="color:var(--red); margin-top:16px;">Фотографии с кодом "${code}" не найдены или были удалены.</p>`;
    return;
  }

  // Mark downloaded
  photos.forEach(p => p.downloaded = true);
  saveData();

  resContainer.innerHTML = photos.map(p => `
    <div class="photo-download-card fade-in">
      <img src="${p.photoUrl}" alt="Цифровое фото">
      <a href="${p.photoUrl}" download="Photo_${p.code}.jpg" class="btn green" style="display:block; text-align:center; text-decoration:none;">Скачать оригинал</a>
    </div>
  `).join('');
}

/* 2. AUTHENTICATION (NO OWNER HINT) */
function renderAuthPage() {
  return `
  <div class="public-wrap fade-in">
    <h2 style="font-family:'Fraunces',serif; margin-bottom:10px;">Авторизация</h2>
    <div class="panel" style="width:100%;">
      <div class="field"><label class="field-label">Логин</label><input type="text" id="loginUser"></div>
      <div class="field"><label class="field-label">Пароль</label><input type="password" id="loginPass"></div>
      <button class="btn gold" onclick="handleLogin()">Войти в кабинет</button>
    </div>
    <button class="btn outline" onclick="session.currentTab='download_public'; render();">← На страницу скачивания фото</button>
  </div>`;
}

function handleLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const user = state.users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
  
  if(!user) { toast('Неверный логин или пароль', true); return; }
  session.userId = user.id;
  session.currentTab = user.role === 'owner' ? 'overview' : 'work';
  render();
}

/* 3. EMPLOYEE DASHBOARD (Сотрудник на 1 точке, отчёт, зарплата, фото) */
function renderEmployeeDashboard(user) {
  const assignedPointId = user.assignedPoints && user.assignedPoints[0];
  const point = state.points.find(p => p.id === assignedPointId);

  if(!point) {
    return `<div class="topbar"><h1>Кабинет сотрудника</h1><button class="btn small outline" onclick="logout()">Выйти</button></div>
    <div class="content"><div class="panel">Владелец пока не привязал вас к точке. Обратитесь к администратору.</div></div>`;
  }

  return `
  <div class="topbar">
    <div><h1>${point.name}</h1><span class="role-chip">Продавец: ${user.username}</span></div>
    <button class="btn small outline" onclick="logout()">Выйти</button>
  </div>
  <div class="content fade-in">
    <!-- Баланс и Зарплата -->
    <div class="panel" style="border-color:var(--brass);">
      <div class="stat-label">Мой Баланс Зарплаты</div>
      <div class="stat-value" style="font-size:24px;">${money(user.salaryBalance || 0)}</div>
      <p style="font-size:11px; color:var(--ink-soft); margin:4px 0 10px;">Процент точки: ${point.salaryPercent||0}% с продаж</p>
      <button class="btn small gold" onclick="requestFullBalancePayout('${user.id}')">Запросить вывод всего баланса</button>
    </div>

    <!-- Заполнение отчета -->
    <div class="panel">
      <h3 style="margin-top:0;">Сдать отчет за сегодня</h3>
      <div class="field"><label class="field-label">Выручка, ₽</label><input type="number" id="empRev" placeholder="0"></div>
      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;"><label class="field-label">Продано мал. (шт)</label><input type="number" id="empSmall" placeholder="0"></div>
        <div class="field" style="flex:1;"><label class="field-label">Продано бол. (шт)</label><input type="number" id="empBig" placeholder="0"></div>
      </div>
      <button class="btn green" onclick="submitEmployeeReport('${point.id}')">Отправить отчет</button>
    </div>

    <!-- Загрузка фото для покупателей -->
    <div class="panel">
      <h3 style="margin-top:0;">Загрузка цифровых фото</h3>
      <div class="field"><label class="field-label">Код заказа (выдайте покупателю)</label><input type="text" id="uploadCode" placeholder="1024"></div>
      <div class="field"><label class="field-label">Выбрать файл</label><input type="file" id="uploadFile" accept="image/*"></div>
      <button class="btn blue" onclick="uploadDigitalPhoto('${point.id}')">Загрузить фото</button>
    </div>

    <!-- Управление загруженными фото -->
    <div class="panel">
      <h3>Загруженные фото точки</h3>
      ${renderPhotoListForPoint(point.id)}
    </div>
  </div>`;
}

function submitEmployeeReport(pointId) {
  const rev = parseFloat(document.getElementById('empRev').value) || 0;
  const small = parseInt(document.getElementById('empSmall').value) || 0;
  const big = parseInt(document.getElementById('empBig').value) || 0;
  
  if(rev <= 0) { toast('Укажите корректную выручку', true); return; }

  const point = state.points.find(p => p.id === pointId);
  const user = currentUser();

  point.revenue += rev;
  point.small = Math.max(0, point.small - small);
  point.big = Math.max(0, point.big - big);

  // Расчет зарплаты
  const earnedSalary = Math.round(rev * ((point.salaryPercent || 0) / 100));
  user.salaryBalance = (user.salaryBalance || 0) + earnedSalary;

  state.salesEntries.unshift({ id: uid(), pointId, date: todayStr(), small, big, revenue: rev, userId: user.id, username: user.username });
  saveData();

  toast(`Отчет сохранен! Начислено зарплаты: ${money(earnedSalary)}`);
  
  // Предложение запросить именно эту выплату сразу
  if(confirm(`Отчёт сдан! Начислено: ${earnedSalary} ₽. Отправить владельцу запрос на немедленную выплату за сегодня?`)) {
    requestTodaySalaryPayout(user.id, earnedSalary);
  } else {
    render();
  }
}

function requestTodaySalaryPayout(userId, amount) {
  state.payoutRequests.unshift({
    id: uid(), userId, username: currentUser().username, amount, type: 'Выплата за день', date: todayStr(), status: 'pending'
  });
  saveData();
  toast('Запрос на выплату за сегодня отправлен владельцу!');
  render();
}

function requestFullBalancePayout(userId) {
  const u = currentUser();
  if(!u.salaryBalance || u.salaryBalance <= 0) { toast('Ваш баланс пуст', true); return; }
  
  state.payoutRequests.unshift({
    id: uid(), userId, username: u.username, amount: u.salaryBalance, type: 'Вывод баланса', date: todayStr(), status: 'pending'
  });
  saveData();
  toast('Запрос на вывод всего баланса отправлен!');
  render();
}

/* Загрузка цифрового фото */
function uploadDigitalPhoto(pointId) {
  const code = document.getElementById('uploadCode').value.trim();
  const fileInput = document.getElementById('uploadFile');
  if(!code || !fileInput.files[0]) { toast('Укажите код и выберите файл', true); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    state.digitalPhotos.unshift({
      id: uid(), code, photoUrl: e.target.result, uploadedBy: currentUser().username, pointId, downloaded: false, createdAt: Date.now()
    });
    saveData();
    toast('Фото успешно загружено');
    render();
  };
  reader.readAsDataURL(fileInput.files[0]);
}

function renderPhotoListForPoint(pointId) {
  const list = state.digitalPhotos.filter(p => p.pointId === pointId);
  if(!list.length) return `<p style="color:var(--ink-soft); font-size:12px;">Фотографий пока нет</p>`;

  return list.map(p => `
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:8px 0;">
      <div>
        <b>Код: ${p.code}</b> 
        <span style="font-size:11px; color:${p.downloaded ? 'var(--green)' : 'var(--brass)'};">
          (${p.downloaded ? 'Скачано клиентом' : 'Ожидает скачивания'})
        </span>
      </div>
      <button class="btn small red" onclick="deleteDigitalPhoto('${p.id}')">Удалить</button>
    </div>
  `).join('');
}

function deleteDigitalPhoto(photoId) {
  state.digitalPhotos = state.digitalPhotos.filter(p => p.id !== photoId);
  saveData();
  toast('Фото удалено с сервера');
  render();
}

/* 4. BUYER DASHBOARD (Закупщик на много точек) */
function renderBuyerDashboard(user) {
  const allowedPoints = state.points.filter(p => user.assignedPoints && user.assignedPoints.includes(p.id));

  if(!allowedPoints.length) {
    return `<div class="topbar"><h1>Кабинет закупщика</h1><button class="btn small outline" onclick="logout()">Выйти</button></div>
    <div class="content"><div class="panel">Вам не назначена ни одна точка для закупок.</div></div>`;
  }

  const selectedPtId = session.selectedBuyerPointId || allowedPoints[0].id;
  const point = state.points.find(p => p.id === selectedPtId);

  return `
  <div class="topbar"><h1>Закупки</h1><button class="btn small outline" onclick="logout()">Выйти</button></div>
  <div class="content fade-in">
    <div class="point-select">
      ${allowedPoints.map(p => `<button class="point-chip ${p.id === point.id ? 'active' : ''}" onclick="session.selectedBuyerPointId='${p.id}'; render();">${p.name}</button>`).join('')}
    </div>
    <div class="panel">
      <h3>Закупка для: ${point.name}</h3>
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <div class="field" style="flex:1;"><label class="field-label">+ Маленьких (шт)</label><input type="number" id="buySm" placeholder="0"></div>
        <div class="field" style="flex:1;"><label class="field-label">+ Больших (шт)</label><input type="number" id="buyBg" placeholder="0"></div>
      </div>
      <div class="field"><label class="field-label">Потрачено средств, ₽</label><input type="number" id="buyCost" placeholder="0"></div>
      <button class="btn blue" onclick="submitPurchase('${point.id}')">Провести закупку</button>
    </div>
  </div>`;
}

function submitPurchase(pointId) {
  const small = parseInt(document.getElementById('buySm').value) || 0;
  const big = parseInt(document.getElementById('buyBg').value) || 0;
  const cost = parseFloat(document.getElementById('buyCost').value) || 0;

  const point = state.points.find(p => p.id === pointId);
  point.small += small;
  point.big += big;
  point.revenue -= cost;

  state.purchaseEntries.unshift({ id: uid(), pointId, date: todayStr(), small, big, cost, userId: currentUser().id, username: currentUser().username });
  saveData();
  toast('Закупка успешно зафиксирована');
  render();
}

/* 5. OWNER DASHBOARD (Управление точками, сотрудниками, процентами и запросами выплат) */
function renderOwnerDashboard(user) {
  return `
  <div class="topbar">
    <div><h1>Панель Владельца</h1><span class="role-chip">${user.username}</span></div>
    <button class="btn small outline" onclick="logout()">Выйти</button>
  </div>
  <div class="content fade-in">
    <!-- Навигационные вкладки -->
    <div class="point-select">
      <button class="point-chip ${session.currentTab==='overview'?'active':''}" onclick="session.currentTab='overview';render();">Обзор и Точки</button>
      <button class="point-chip ${session.currentTab==='team'?'active':''}" onclick="session.currentTab='team';render();">Команда и Выплаты</button>
      <button class="point-chip ${session.currentTab==='photos'?'active':''}" onclick="session.currentTab='photos';render();">Все Фотографии</button>
    </div>

    ${session.currentTab === 'overview' ? renderOwnerOverview() : ''}
    ${session.currentTab === 'team' ? renderOwnerTeam() : ''}
    ${session.currentTab === 'photos' ? renderOwnerPhotos() : ''}
  </div>`;
}

function renderOwnerOverview() {
  const totalRev = state.points.reduce((s, p) => s + p.revenue, 0);

  return `
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Чистая прибыль</div><div class="stat-value">${money(totalRev)}</div></div>
    <div class="stat-card"><div class="stat-label">Всего точек</div><div class="stat-value" style="color:var(--blue);">${state.points.length}</div></div>
  </div>

  <div class="panel">
    <h3>Список точек</h3>
    ${state.points.map(p => `
      <div style="border-top:1px solid var(--line); padding:12px 0;">
        <b style="font-size:16px;">${p.name}</b>
        <div style="display:flex; justify-content:space-between; margin:6px 0; font-size:13px; color:var(--ink-soft);">
          <span>Касса: ${money(p.revenue)}</span>
          <span>Остаток: ${p.small} мал. / ${p.big} бол.</span>
        </div>
        <div class="field" style="margin-top:8px;">
          <label class="field-label">Процент Зарплаты продавца (%):</label>
          <input type="number" value="${p.salaryPercent || 0}" style="width:100px; padding:6px;" onchange="updatePointSalaryPercent('${p.id}', this.value)">
        </div>
      </div>
    `).join('')}
    <button class="btn outline" onclick="addNewPoint()">+ Добавить точку</button>
  </div>`;
}

function updatePointSalaryPercent(pointId, val) {
  const p = state.points.find(x => x.id === pointId);
  if(p) { p.salaryPercent = parseFloat(val) || 0; saveData(); toast('Процент обновлен'); }
}

function addNewPoint() {
  const name = prompt('Название точки:');
  if(!name) return;
  state.points.push({ id: uid(), name, revenue: 0, small: 0, big: 0, salaryPercent: 10 });
  saveData();
  render();
}

function renderOwnerTeam() {
  const pendingRequests = state.payoutRequests.filter(r => r.status === 'pending');

  return `
  <!-- Запросы на выплату -->
  <div class="panel" style="border-color:var(--brass);">
    <h3>Запросы на выплату зарплаты (${pendingRequests.length})</h3>
    ${!pendingRequests.length ? '<p style="font-size:12px; color:var(--ink-soft);">Нет активных запросов</p>' : 
      pendingRequests.map(r => `
        <div class="payout-card">
          <div><b>${r.username}</b> — <span style="color:var(--green); font-weight:600;">${money(r.amount)}</span> (${r.type})</div>
          <div style="font-size:11px; color:var(--ink-soft);">${r.date}</div>
          <button class="btn small green" style="margin-top:8px;" onclick="approvePayout('${r.id}')">Подтвердить выплату и списать с баланса</button>
        </div>
      `).join('')}
  </div>

  <!-- Список работников и назначение точек -->
  <div class="panel">
    <h3>Управление командой</h3>
    ${state.users.filter(u => u.role !== 'owner').map(u => `
      <div class="user-row">
        <b>${u.username}</b> (Баланс: ${money(u.salaryBalance || 0)})
        <div class="field" style="margin-top:8px;">
          <label class="field-label">Роль:</label>
          <select onchange="updateUserRole('${u.id}', this.value)">
            <option value="employee" ${u.role==='employee'?'selected':''}>Продавец (1 точка)</option>
            <option value="buyer" ${u.role==='buyer'?'selected':''}>Закупщик (много точек)</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Назначенные точки:</label>
          ${renderPointAssignmentSelector(u)}
        </div>
      </div>
    `).join('')}
    <button class="btn gold" onclick="addNewUser()">+ Создать сотрудника</button>
  </div>`;
}

function renderPointAssignmentSelector(user) {
  if (user.role === 'employee') {
    return `<select onchange="assignPointsToUser('${user.id}', [this.value])">
      <option value="">-- Выберите точку --</option>
      ${state.points.map(p => `<option value="${p.id}" ${user.assignedPoints && user.assignedPoints[0]===p.id?'selected':''}>${p.name}</option>`).join('')}
    </select>`;
  } else {
    // Multi select for Buyer
    return state.points.map(p => {
      const checked = user.assignedPoints && user.assignedPoints.includes(p.id);
      return `<label style="display:inline-block; margin-right:10px; font-size:12px;">
        <input type="checkbox" ${checked?'checked':''} onchange="toggleBuyerPoint('${user.id}', '${p.id}', this.checked)"> ${p.name}
      </label>`;
    }).join('');
  }
}

function toggleBuyerPoint(userId, pointId, isChecked) {
  const u = state.users.find(x => x.id === userId);
  if(!u.assignedPoints) u.assignedPoints = [];
  if(isChecked) u.assignedPoints.push(pointId);
  else u.assignedPoints = u.assignedPoints.filter(id => id !== pointId);
  saveData();
}

function assignPointsToUser(userId, pointArray) {
  const u = state.users.find(x => x.id === userId);
  u.assignedPoints = pointArray;
  saveData();
  toast('Точка закреплена');
}

function updateUserRole(userId, role) {
  const u = state.users.find(x => x.id === userId);
  u.role = role;
  u.assignedPoints = [];
  saveData();
  render();
}

function addNewUser() {
  const name = prompt('Логин сотрудника:');
  const pass = prompt('Пароль сотрудника:');
  if(!name || !pass) return;
  state.users.push({ id: uid(), username: name, password: pass, role: 'employee', assignedPoints: [], salaryBalance: 0 });
  saveData();
  render();
}

function approvePayout(requestId) {
  const req = state.payoutRequests.find(r => r.id === requestId);
  const user = state.users.find(u => u.id === req.userId);
  
  if(user) {
    user.salaryBalance = Math.max(0, (user.salaryBalance || 0) - req.amount);
  }
  req.status = 'approved';
  state.payoutRequests = state.payoutRequests.filter(r => r.id !== requestId);
  saveData();
  toast('Выплата произведена, баланс сотрудника обнулен');
  render();
}

function renderOwnerPhotos() {
  return `
  <div class="panel">
    <h3>Все цифры и загруженные фото</h3>
    ${!state.digitalPhotos.length ? '<p style="color:var(--ink-soft); font-size:12px;">Файлов нет</p>' :
      state.digitalPhotos.map(p => `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:10px 0;">
          <div>
            <b>Код: ${p.code}</b> (${p.uploadedBy})
            <div style="font-size:11px; color:${p.downloaded ? 'var(--green)' : 'var(--brass)'};">
              ${p.downloaded ? 'Скачано клиентом' : 'Не скачано'}
            </div>
          </div>
          <button class="btn small red" onclick="deleteDigitalPhoto('${p.id}')">Удалить с сайта</button>
        </div>
      `).join('')}
  </div>`;
}

function logout() {
  session.userId = null;
  session.currentTab = 'download_public';
  render();
}

/* INITIALIZATION */
(function init() {
  loadData();
  render();
})();
</script>
</body>
</html>
