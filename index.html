<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Управление Фотоцентром</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F10; --bg-2: #18181B; --surface: #1B1B1E; --surface-2: #232326;
    --ink: #F1EDE4; --ink-soft: #9C978C; --line: #2A2A2D; --line-strong: #38383C;
    --red: #C6685A; --blue: #7C9BC2; --brass: #C7A15C; --green: #7FAE8E;
    --warn-tint: rgba(199,161,92,0.14); --danger-tint: rgba(198,104,90,0.15); --radius: 12px; --radius-sm: 8px;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; min-height:100vh; font-family:'IBM Plex Sans', sans-serif; background:var(--bg); color:var(--ink); }
  button, input, select, textarea { font-family:inherit; touch-action: manipulation; }

  #root { width: 100%; max-width: 1000px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
  @media (min-width: 768px) { #root { padding-top: 16px; } }

  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .role-chip { font-size:10px; text-transform:uppercase; color:var(--brass); font-weight:600; letter-spacing:0.05em; }

  .nav-tabs { display:flex; gap:8px; overflow-x:auto; padding:12px 20px; background:var(--bg-2); border-bottom:1px solid var(--line); }
  .tab-btn { padding:8px 14px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:transparent; color:var(--ink-soft); font-size:12px; flex:none; cursor:pointer; position:relative; }
  .tab-btn.active { background:var(--brass); color:#100F0D; border-color:var(--brass); font-weight:600; }

  .content { padding:20px; }
  .stats-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .stat-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .stat-value { font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; color:var(--green); }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .field { margin-bottom:12px; }
  .field-label { font-size:11px; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:6px; }
  
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea { width:100%; border:1px solid var(--line-strong); background:var(--bg-2); padding:10px 12px; font-size:14px; color:var(--ink); border-radius:var(--radius-sm); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--brass); }

  .btn { border:none; background:var(--ink); color:var(--bg); padding:10px 16px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; border-radius:var(--radius-sm); font-weight:600; width:100%; cursor:pointer; margin-top:6px; position:relative; }
  .btn.gold { background:var(--brass); color:#100F0D; }
  .btn.blue { background:var(--blue); color:#fff; }
  .btn.green { background:var(--green); color:#fff; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.outline { background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
  .btn.small { width:auto; padding:6px 12px; font-size:11px; margin:0; }

  .payout-card { border:1px solid var(--brass); background:var(--warn-tint); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; }
  .public-wrap { min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; max-width:460px; margin:0 auto; padding:20px; text-align:center; }

  /* Messenger & Chat Styles */
  .messenger-layout { display: flex; flex-direction: column; height: 500px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  @media (min-width: 600px) { .messenger-layout { flex-direction: row; } }
  
  .chat-sidebar { width: 100%; max-height: 180px; overflow-y: auto; border-bottom: 1px solid var(--line); background: var(--surface); }
  @media (min-width: 600px) { .chat-sidebar { width: 220px; max-height: 100%; border-bottom: none; border-right: 1px solid var(--line); } }
  
  .dialog-item { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .dialog-item:hover, .dialog-item.active { background: var(--surface-2); }
  .dialog-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }

  .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; }
  .chat-header { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--brass); }
  .chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-2); }
  .chat-msg { background: var(--surface-2); padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line); font-size: 13px; position: relative; max-width: 85%; align-self: flex-start; }
  .chat-msg.mine { border-color: var(--brass); background: rgba(199, 161, 92, 0.08); align-self: flex-end; }
  .chat-msg-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; gap: 8px; }
  .chat-msg-body { word-break: break-word; white-space: pre-wrap; margin-bottom: 6px; }

  /* Notification Badge on buttons */
  .badge { position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff; font-size: 10px; font-weight: bold; border-radius: 10px; padding: 2px 5px; line-height: 1; min-width: 16px; text-align: center; }

  /* Fullscreen Image Lightbox */
  .lightbox-modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 20px; }
  .lightbox-modal.active { display: flex; }
  .lightbox-modal img { max-width: 95%; max-height: 95%; border-radius: var(--radius-sm); object-fit: contain; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
  .lightbox-close { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; font-weight: bold; }

  .copy-box { background: var(--bg-2); border: 1px dashed var(--brass); padding: 12px; border-radius: var(--radius-sm); margin-top: 12px; text-align: left; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:var(--radius-sm); font-size:13px; font-family:'IBM Plex Mono', monospace; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.show { opacity:1; }
  #toast.err { background:var(--red); color:#fff; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="root"></div>
<div id="toast"></div>

<!-- Lightbox Modal -->
<div id="lightboxModal" class="lightbox-modal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" src="" alt="Увеличенное фото">
</div>

<script>
// ==========================================
// 1. CONFIG / КЛЮЧИ
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyAWjkzWoXK3F-YTjq5qPEVLL2Li6pAoO0g",
  authDomain: "photo-center-tuapse.firebaseapp.com",
  databaseURL: "https://photo-center-tuapse-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "photo-center-tuapse",
  storageBucket: "photo-center-tuapse.firebasestorage.app",
  messagingSenderId: "633147729123",
  appId: "1:633147729123:web:04247d0657312a4301d1d6"
};

const IMGBB_API_KEY = "62e211fd034a3eb244e89ca683c7181b";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref('app_state');

// ==========================================
// 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И СОСТОЯНИЕ
// ==========================================
const money = n => (Math.round(n||0)).toLocaleString('ru-RU') + ' ₽';
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowFormatted = () => new Date().toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });

function defaultState() {
  return {
    masterPassword: '12345',
    currentSeason: new Date().getFullYear().toString(),
    users: [
      { id: 'owner_1', username: 'Owner', password: '123', role: 'owner', salaryBalance: 0 }
    ],
    points: [
      { id: 'pt_1', name: 'Главная точка', revenue: 0, small: 100, big: 100, salaryPercent: 10 }
    ],
    salesEntries: [],
    purchaseEntries: [],
    payoutRequests: [],
    digitalPhotos: [],
    archivedSeasons: [],
    chatMessages: [],
    customerRequests: []
  };
}

let state = defaultState();
let currentSearchResultHtml = ''; 
let currentSearchedCode = '';
let generatedClientText = '';

// Буфер для сохранения состояния локальных полей ввода перед перерендером
let formBuffer = {};

const savedSession = JSON.parse(localStorage.getItem('app_session') || 'null');
let session = savedSession || { 
  userId: null, 
  currentTab: 'download_public', 
  publicMode: 'download',
  ownerSubTab: 'overview', 
  userSubTab: 'main', 
  activeChatTarget: 'all',
  ownerRequestFilter: 'all'
};

function saveSession() {
  localStorage.setItem('app_session', JSON.stringify(session));
}

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.className = '', 2800);
}

function openLightbox(url) {
  const modal = document.getElementById('lightboxModal');
  const img = document.getElementById('lightboxImg');
  if (modal && img) {
    img.src = url;
    modal.classList.add('active');
  }
}

function closeLightbox() {
  const modal = document.getElementById('lightboxModal');
  if (modal) modal.classList.remove('active');
}

// Запоминание значений полей ввода перед обновлением DOM
function preserveFormInputs() {
  const inputs = document.querySelectorAll('input, select, textarea');
  inputs.forEach(el => {
    if (el.id && el.type !== 'file') {
      formBuffer[el.id] = el.value;
    }
  });
}

// Восстановление значений полей ввода после обновления DOM
function restoreFormInputs() {
  Object.keys(formBuffer).forEach(id => {
    const el = document.getElementById(id);
    if (el && formBuffer[id] !== undefined && formBuffer[id] !== '') {
      el.value = formBuffer[id];
    }
  });
}

dbRef.on('value', (snapshot) => {
  const data = snapshot.val();
  
  if (data && JSON.stringify(state) === JSON.stringify(data)) {
    return;
  }

  if (data) {
    state = data;
    if (!state.masterPassword) state.masterPassword = '12345';
    if (!state.currentSeason) state.currentSeason = new Date().getFullYear().toString();
    if (!state.users) state.users = [];
    if (!state.points) state.points = [];
    if (!state.salesEntries) state.salesEntries = [];
    if (!state.purchaseEntries) state.purchaseEntries = [];
    if (!state.payoutRequests) state.payoutRequests = [];
    if (!state.digitalPhotos) state.digitalPhotos = [];
    if (!state.archivedSeasons) state.archivedSeasons = [];
    if (!state.chatMessages) state.chatMessages = [];
    if (!state.customerRequests) state.customerRequests = [];
  } else {
    state = defaultState();
    saveData();
  }

  const activeElement = document.activeElement;
  const isTypingInChat = activeElement && activeElement.id === 'chatInputText';
  const isTypingOther = activeElement && activeElement.id !== 'chatInputText' && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA' || activeElement.tagName === 'SELECT');

  // Проверка, есть ли прикрепленные файлы
  const custFile = document.getElementById('custMagnetFile');
  const empFile = document.getElementById('uploadFile');
  const ownerFile = document.getElementById('ownerUploadFile');
  const hasFiles = (custFile && custFile.files.length > 0) || 
                   (empFile && empFile.files.length > 0) || 
                   (ownerFile && ownerFile.files.length > 0);

  // Проверка заполненности клиентской формы
  const custName = document.getElementById('custName');
  const custPhone = document.getElementById('custPhone');
  const hasUnsavedClientData = (custName && custName.value.trim().length > 0) || (custPhone && custPhone.value.trim().length > 0);

  // Разрешаем рендер чата в режиме реального времени
  if (!isTypingOther && !hasFiles && !hasUnsavedClientData) {
    render();
  }
});

function saveData() {
  dbRef.set(state).catch(err => {
    toast('Ошибка сохранения в Базу Данных', true);
    console.error(err);
  });
}

function currentUser() { return state.users.find(u => u.id === session.userId) || null; }

function getUnreadChatCount(userId) {
  if (!userId) return 0;
  return state.chatMessages.filter(m => {
    const isForMe = (m.targetId === 'all' || m.targetId === userId);
    const notMine = m.senderId !== userId;
    const notRead = !m.readBy || !m.readBy.includes(userId);
    return isForMe && notMine && notRead;
  }).length;
}

function getUnreadCountForDialog(user, dialogId) {
  return state.chatMessages.filter(m => {
    const notMine = m.senderId !== user.id;
    const notRead = !m.readBy || !m.readBy.includes(user.id);
    if (dialogId === 'all') {
      return m.targetId === 'all' && notMine && notRead;
    } else {
      return (m.senderId === dialogId && m.targetId === user.id) && notRead;
    }
  }).length;
}

function markMessagesAsRead(userId, dialogTarget) {
  let updated = false;
  state.chatMessages.forEach(m => {
    const isTarget = (dialogTarget === 'all' && m.targetId === 'all') || 
                     (dialogTarget !== 'all' && ((m.senderId === dialogTarget && m.targetId === userId) || (m.senderId === userId && m.targetId === dialogTarget)));
    if (isTarget && m.senderId !== userId) {
      if (!m.readBy) m.readBy = [];
      if (!m.readBy.includes(userId)) {
        m.readBy.push(userId);
        updated = true;
      }
    }
  });
  if (updated) saveData();
}

function switchOwnerSubTab(tabName) {
  session.ownerSubTab = tabName;
  saveSession();
  render();
}

function switchUserSubTab(tabName) {
  session.userSubTab = tabName;
  saveSession();
  render();
}

function switchCurrentTab(tabName) {
  session.currentTab = tabName;
  saveSession();
  render();
}

function render() {
  preserveFormInputs(); // Сохраняем значения полей перед рендерингом
  const scrollPos = window.scrollY;
  const root = document.getElementById('root');
  const user = currentUser();

  if (session.currentTab === 'download_public') {
    root.innerHTML = renderPublicDownloadPage();
    restoreFormInputs(); // Восстанавливаем данные полей
    window.scrollTo(0, scrollPos);
    return;
  }

  if (!user) {
    root.innerHTML = renderAuthPage();
    restoreFormInputs();
    window.scrollTo(0, scrollPos);
    return;
  }

  if (user.role === 'owner') root.innerHTML = renderOwnerDashboard(user);
  else if (user.role === 'employee') root.innerHTML = renderEmployeeDashboard(user);
  else if (user.role === 'buyer') root.innerHTML = renderBuyerDashboard(user);

  restoreFormInputs(); // Восстанавливаем данные полей
  window.scrollTo(0, scrollPos);
}

/* PUBLIC DOWNLOAD & REQUEST PAGE */
function renderPublicDownloadPage() {
  const mode = session.publicMode || 'request';

  return `
  <div class="public-wrap fade-in">
    <div style="display:flex; gap:8px; width:100%; margin-bottom:16px;">
      <button class="btn ${mode === 'request' ? 'gold' : 'outline'}" onclick="session.publicMode='request'; saveSession(); render();">Оформить заявку</button>
      <button class="btn ${mode === 'download' ? 'gold' : 'outline'}" onclick="session.publicMode='download'; saveSession(); render();">Скачать фото</button>
    </div>

    ${mode === 'request' ? `
      <h2>Получить фотографии</h2>
      <p style="color:var(--ink-soft); font-size:13px;">Выберите точку покупки, заполните данные и сфотографируйте магнит</p>
      
      <div class="panel" style="width:100%; text-align:left;">
        <div class="field">
          <label class="field-label">Точка, где вы покупали</label>
          <select id="custPointId" onchange="formBuffer['custPointId']=this.value">
            <option value="">-- Выберите точку --</option>
            ${state.points.map(pt => `<option value="${pt.id}">${pt.name}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Ваше Имя</label>
          <input type="text" id="custName" placeholder="Иван" oninput="formBuffer['custName']=this.value">
        </div>
        <div class="field">
          <label class="field-label">Номер телефона</label>
          <input type="text" id="custPhone" placeholder="+7 900 000 00 00" oninput="formBuffer['custPhone']=this.value">
        </div>
        <div class="field">
          <label class="field-label">Фотография магнита</label>
          <input type="file" id="custMagnetFile" accept="image/*">
        </div>
        <button class="btn gold" onclick="submitCustomerRequest()">Отправить заявку продавцу</button>
      </div>
    ` : `
      <h2>Скачать Фотографии</h2>
      <p style="color:var(--ink-soft); font-size:13px;">Введите код заказа для получения фотографий</p>
      <div style="width:100%; margin:16px 0;">
        <input type="text" id="photoCodeInput" value="${currentSearchedCode}" placeholder="Код заказа (например 1024)" style="text-align:center; font-size:18px;" oninput="formBuffer['photoCodeInput']=this.value">
        <button class="btn gold" onclick="searchPhotoByCode()">Найти фото</button>
      </div>
      <div id="photoSearchResult" style="width:100%;">${currentSearchResultHtml}</div>
    `}

    <div style="margin-top:24px; font-size:13px; color:var(--ink-soft); background:var(--surface); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--line); width:100%;">
      Возникли проблемы или ошибки?<br>
      Обратная связь: <a href="tel:+79256860074" style="color:var(--brass); text-decoration:none; font-weight:600;">+7 925 686 00 74</a>
    </div>
    <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:20px; width:100%;">
      <button class="btn outline" onclick="switchCurrentTab('login')">Вход для персонала</button>
    </div>
  </div>`;
}

async function submitCustomerRequest() {
  const pointId = document.getElementById('custPointId').value;
  const nameInput = document.getElementById('custName');
  const phoneInput = document.getElementById('custPhone');
  const fileInput = document.getElementById('custMagnetFile');
  
  const name = nameInput ? nameInput.value.trim() : '';
  const phone = phoneInput ? phoneInput.value.trim() : '';
  const file = fileInput ? fileInput.files[0] : null;

  if(!pointId) return toast('Выберите точку, где делали покупку', true);
  if(!name || !phone || !file) return toast('Заполните имя, телефон и выберите фото магнита', true);

  toast('Загрузка снимка...');

  const formData = new FormData();
  formData.append('image', file);

  try {
    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    const result = await response.json();

    if(result.success) {
      state.customerRequests.unshift({
        id: uid(),
        pointId,
        name,
        phone,
        magnetUrl: result.data.url,
        date: nowFormatted(),
        status: 'pending'
      });
      
      // Полная очистка локальных элементов формы и буфера
      delete formBuffer['custName'];
      delete formBuffer['custPhone'];
      delete formBuffer['custPointId'];

      if (nameInput) nameInput.value = '';
      if (phoneInput) phoneInput.value = '';
      if (fileInput) fileInput.value = '';

      saveData();
      alert('Заявка успешно отправлена! Продавец этой точки уже обрабатывает её.');
      session.publicMode = 'download';
      saveSession();
      render();
    } else {
      toast('Ошибка загрузки фото', true);
    }
  } catch(e) {
    toast('Ошибка сети при загрузке', true);
  }
}

function rejectCustomerRequest(requestId) {
  if (confirm('Отклонить эту заявку от клиента?')) {
    const req = state.customerRequests.find(r => r.id === requestId);
    if (req) {
      req.status = 'rejected';
      saveData();
      toast('Заявка отклонена');
    }
  }
}

function searchPhotoByCode() {
  const codeInput = document.getElementById('photoCodeInput');
  const code = codeInput ? codeInput.value.trim() : '';
  const res = document.getElementById('photoSearchResult');
  if(!code) return toast('Введите код', true);

  currentSearchedCode = code;

  const photos = state.digitalPhotos.filter(p => p.code === code);
  if(!photos.length) {
    currentSearchResultHtml = `<p style="color:var(--red); margin-top:12px;">Фотографии не найдены</p>`;
    if (res) res.innerHTML = currentSearchResultHtml;
    return;
  }

  currentSearchResultHtml = `
    <div style="margin-top:16px; width:100%;">
      <p style="font-size:13px; color:var(--green); font-weight:600; margin-bottom:12px;">Найдено снимков: ${photos.length}</p>
      ${photos.map((p, idx) => `
        <div class="panel fade-in" style="margin-bottom:12px; text-align:left;">
          <img src="${p.photoUrl}" style="width:100%; border-radius:var(--radius-sm); margin-bottom:10px; cursor:pointer;" onclick="openLightbox('${p.photoUrl}')">
          <button class="btn green" onclick="downloadPhotoFile('${p.id}', '${p.photoUrl}', 'Photo_${p.code}_${idx+1}.jpg')">Скачать фото №${idx+1}</button>
        </div>
      `).join('')}
    </div>
  `;

  if (res) res.innerHTML = currentSearchResultHtml;
}

async function downloadPhotoFile(photoId, photoUrl, fileName) {
  toast('Скачивание файла...');
  
  const photo = state.digitalPhotos.find(p => p.id === photoId);
  if (photo) {
    photo.downloaded = true;
    saveData();
  }

  try {
    const response = await fetch(photoUrl);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = blobUrl;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
    toast('Файл сохранен!');
  } catch (err) {
    console.error(err);
    const link = document.createElement('a');
    link.href = photoUrl;
    link.download = fileName;
    link.target = '_blank';
    link.click();
  }
}

        </div>

        <div class="chat-box" id="chatBox">
          ${!visibleMessages.length ? '<p style="font-size:12px; color:var(--ink-soft); text-align:center; margin:auto;">Сообщений пока нет</p>' :
            visibleMessages.map(m => {
              const isMine = m.senderId === user.id;
              const isOwner = user.role === 'owner';
              const canDelete = isMine || isOwner;

              return `
              <div class="chat-msg ${isMine ? 'mine' : ''}">
                <div class="chat-msg-header">

                ${canDelete ? `<button class="btn small red" style="padding:2px 6px; font-size:10px; width:auto;" onclick="deleteChatMessage('${m.id}')">Удалить</button>` : ''}

function sendChatMessage() {
  const textInput = document.getElementById('chatInputText');
  const text = textInput ? textInput.value.trim() : '';
  if (!text) return toast('Введите текст сообщения', true);

  const user = currentUser();
  const targetId = session.activeChatTarget || 'all';

  state.chatMessages.push({
    id: uid(),
    senderId: user.id,
    senderName: user.username,
    targetId: targetId,
    text: text,
    time: nowFormatted(),
    readBy: [user.id]
  });

  delete formBuffer['chatInputText'];
  saveData();
  if (textInput) textInput.value = '';
}

function deleteChatMessage(msgId) {
  const user = currentUser();
  const msg = state.chatMessages.find(m => m.id === msgId);
  if (!msg) return;

  if (user.role === 'owner' || msg.senderId === user.id) {
    if (confirm('Удалить это сообщение?')) {
      state.chatMessages = state.chatMessages.filter(m => m.id !== msgId);
      saveData();
      toast('Сообщение удалено');
    }
  } else {
    toast('У вас нет прав на удаление этого сообщения', true);
  }
}

function changeMyPassword() {
  const curr = document.getElementById('currPassword').value;
  const newP = document.getElementById('newPassword').value;
  const confP = document.getElementById('confirmPassword').value;

  const user = currentUser();
  if(!curr || !newP || !confP) return toast('Заполните все поля', true);
  if(user.password !== curr) return toast('Неверный текущий пароль', true);
  if(newP !== confP) return toast('Новые пароли не совпадают', true);

  user.password = newP;
  saveData();
  toast('Пароль аккаунта изменён!');
}

function changeMasterPassword() {
  const curr = document.getElementById('currMasterPass').value;
  const newP = document.getElementById('newMasterPass').value;

  if(curr !== state.masterPassword) return toast('Неверный текущий мастер-пароль', true);
  if(!newP || newP.length < 3) return toast('Пароль слишком короткий', true);

  state.masterPassword = newP;
  saveData();
  toast('Мастер-пароль сброса изменен!');
}

      <div class="field"><label class="field-label">Выручка, ₽</label><input type="number" id="empRev" oninput="formBuffer['empRev']=this.value">Все три исправления внесены в исходный код:

1. **Очистка формы клиента:** После успешной отправки заявки значения полей (`custName`, `custPhone`, `custPointId`) и прикрепленный файл очищаются, а также сбрасываются из временного буфера ввода[cite: 1].
2. **Обновление чата в реальном времени:** В цикле прослушивания Firebase (`dbRef.on('value', ...)`) убрана задержка и блокировка перерендера, если открыт или активен чат[cite: 1]. Теперь входящие сообщения и счетчики уведомлений обновляются мгновенно без необходимости перезагружать страницу[cite: 1].
3. **Удаление заявки при присвоении номера:** Функция `fillUploadCodeFromRequest()` сразу меняет статус заявки и скрывает ее из списка активных заявок (а не только при загрузке фото)[cite: 1]. Изменение сразу синхронизируется через Realtime Database, поэтому заявка моментально исчезает у всех продавцов этой точки и у владельца[cite: 1].

  .copy-box { background: var(--bg-2); border: 1px dashed var(--brass); padding: 12px; border-radius: var(--radius-sm); margin-top: 12px; text-align: left; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:var(--radius-sm); font-size:13px; font-family:'IBM Plex Mono', monospace; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.show { opacity:1; }
  #toast.err { background:var(--red); color:#fff; }
</style>

<script src="[https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js](https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js)"></script>
<script src="[https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js](https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js)"></script>
</head>
<body>

<div id="root"></div>
<div id="toast"></div>

<!-- Lightbox Modal -->
<div id="lightboxModal" class="lightbox-modal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" src="" alt="Увеличенное фото">
</div>

<script>
// ==========================================
// 1. CONFIG / КЛЮЧИ
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyAWjkzWoXK3F-YTjq5qPEVLL2Li6pAoO0g",
  authDomain: "photo-center-tuapse.firebaseapp.com",
  databaseURL: "[https://photo-center-tuapse-default-rtdb.europe-west1.firebasedatabase.app](https://photo-center-tuapse-default-rtdb.europe-west1.firebasedatabase.app)",
  projectId: "photo-center-tuapse",
  storageBucket: "photo-center-tuapse.firebasestorage.app",
  messagingSenderId: "633147729123",
  appId: "1:633147729123:web:04247d0657312a4301d1d6"
};

const IMGBB_API_KEY = "62e211fd034a3eb244e89ca683c7181b";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref('app_state');

// ==========================================
// 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И СОСТОЯНИЕ
// ==========================================
const money = n => (Math.round(n||0)).toLocaleString('ru-RU') + ' ₽';
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowFormatted = () => new Date().toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });

function defaultState() {
  return {
    masterPassword: '12345',
    currentSeason: new Date().getFullYear().toString(),
    users: [
      { id: 'owner_1', username: 'Owner', password: '123', role: 'owner', salaryBalance: 0 }
    ],
    points: [
      { id: 'pt_1', name: 'Главная точка', revenue: 0, small: 100, big: 100, salaryPercent: 10 }
    ],
    salesEntries: [],
    purchaseEntries: [],
    payoutRequests: [],
    digitalPhotos: [],
    archivedSeasons: [],
    chatMessages: [],
    customerRequests: []
  };
}

let state = defaultState();
let currentSearchResultHtml = ''; 
let currentSearchedCode = '';
let generatedClientText = '';

// Буфер для сохранения состояния локальных полей ввода перед перерендером
let formBuffer = {};

const savedSession = JSON.parse(localStorage.getItem('app_session') || 'null');
let session = savedSession || { 
  userId: null, 
  currentTab: 'download_public', 
  publicMode: 'download',
  ownerSubTab: 'overview', 
  userSubTab: 'main', 
  activeChatTarget: 'all',
  ownerRequestFilter: 'all'
};

function saveSession() {
  localStorage.setItem('app_session', JSON.stringify(session));
}

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.className = '', 2800);
}

function openLightbox(url) {
  const modal = document.getElementById('lightboxModal');
  const img = document.getElementById('lightboxImg');
  if (modal && img) {
    img.src = url;
    modal.classList.add('active');
  }
}

function closeLightbox() {
  const modal = document.getElementById('lightboxModal');
  if (modal) modal.classList.remove('active');
}

// Запоминание значений полей ввода перед обновлением DOM
function preserveFormInputs() {
  const inputs = document.querySelectorAll('input, select, textarea');
  inputs.forEach(el => {
    if (el.id && el.type !== 'file') {
      formBuffer[el.id] = el.value;
    }
  });
}

// Восстановление значений полей ввода после обновления DOM
function restoreFormInputs() {
  Object.keys(formBuffer).forEach(id => {
    const el = document.getElementById(id);
    if (el && formBuffer[id] !== undefined && formBuffer[id] !== '') {
      el.value = formBuffer[id];
    }
  });
}

dbRef.on('value', (snapshot) => {
  const data = snapshot.val();
  
  if (data && JSON.stringify(state) === JSON.stringify(data)) {
    return;
  }

  if (data) {
    state = data;
    if (!state.masterPassword) state.masterPassword = '12345';
    if (!state.currentSeason) state.currentSeason = new Date().getFullYear().toString();
    if (!state.users) state.users = [];
    if (!state.points) state.points = [];
    if (!state.salesEntries) state.salesEntries = [];
    if (!state.purchaseEntries) state.purchaseEntries = [];
    if (!state.payoutRequests) state.payoutRequests = [];
    if (!state.digitalPhotos) state.digitalPhotos = [];
    if (!state.archivedSeasons) state.archivedSeasons = [];
    if (!state.chatMessages) state.chatMessages = [];
    if (!state.customerRequests) state.customerRequests = [];
  } else {
    state = defaultState();
    saveData();
  }

  const activeElement = document.activeElement;
  const isTypingInForm = activeElement && 
    (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA' || activeElement.tagName === 'SELECT') && 
    activeElement.id !== 'chatInputText';

  // Проверка, есть ли прикрепленные файлы
  const custFile = document.getElementById('custMagnetFile');
  const empFile = document.getElementById('uploadFile');
  const ownerFile = document.getElementById('ownerUploadFile');
  const hasFiles = (custFile && custFile.files.length > 0) || 
                   (empFile && empFile.files.length > 0) || 
                   (ownerFile && ownerFile.files.length > 0);

  // Проверка заполнености клиентской формы
  const custName = document.getElementById('custName');
  const custPhone = document.getElementById('custPhone');
  const hasUnsavedClientData = (custName && custName.value.trim().length > 0) || (custPhone && custPhone.value.trim().length > 0);

  // При получении новых данных (сообщения чата, новые заявки) делаем рендер всегда, кроме набора текста в обычных формах
  if (!isTypingInForm && !hasFiles && !hasUnsavedClientData) {
    render();
  }
});

function saveData() {
  dbRef.set(state).catch(err => {
    toast('Ошибка сохранения в Базу Данных', true);
    console.error(err);
  });
}

function currentUser() { return state.users.find(u => u.id === session.userId) || null; }

function getUnreadChatCount(userId) {
  if (!userId) return 0;
  return state.chatMessages.filter(m => {
    const isForMe = (m.targetId === 'all' || m.targetId === userId);
    const notMine = m.senderId !== userId;
    const notRead = !m.readBy || !m.readBy.includes(userId);
    return isForMe && notMine && notRead;
  }).length;
}

function getUnreadCountForDialog(user, dialogId) {
  return state.chatMessages.filter(m => {
    const notMine = m.senderId !== user.id;
    const notRead = !m.readBy || !m.readBy.includes(user.id);
    if (dialogId === 'all') {
      return m.targetId === 'all' && notMine && notRead;
    } else {
      return (m.senderId === dialogId && m.targetId === user.id) && notRead;
    }
  }).length;
}

function markMessagesAsRead(userId, dialogTarget) {
  let updated = false;
  state.chatMessages.forEach(m => {
    const isTarget = (dialogTarget === 'all' && m.targetId === 'all') || 
                     (dialogTarget !== 'all' && ((m.senderId === dialogTarget && m.targetId === userId) || (m.senderId === userId && m.targetId === dialogTarget)));
    if (isTarget && m.senderId !== userId) {
      if (!m.readBy) m.readBy = [];
      if (!m.readBy.includes(userId)) {
        m.readBy.push(userId);
        updated = true;
      }
    }
  });
  if (updated) saveData();
}

function switchOwnerSubTab(tabName) {
  session.ownerSubTab = tabName;
  saveSession();
  render();
}

function switchUserSubTab(tabName) {
  session.userSubTab = tabName;
  saveSession();
  render();
}

function switchCurrentTab(tabName) {
  session.currentTab = tabName;
  saveSession();
  render();
}

function render() {
  preserveFormInputs(); // Сохраняем значения полей перед рендерингом
  const scrollPos = window.scrollY;
  const root = document.getElementById('root');
  const user = currentUser();

  if (session.currentTab === 'download_public') {
    root.innerHTML = renderPublicDownloadPage();
    restoreFormInputs(); // Восстанавливаем данные полей
    window.scrollTo(0, scrollPos);
    return;
  }

  if (!user) {
    root.innerHTML = renderAuthPage();
    restoreFormInputs();
    window.scrollTo(0, scrollPos);
    return;
  }

  if (user.role === 'owner') root.innerHTML = renderOwnerDashboard(user);
  else if (user.role === 'employee') root.innerHTML = renderEmployeeDashboard(user);
  else if (user.role === 'buyer') root.innerHTML = renderBuyerDashboard(user);

  restoreFormInputs(); // Восстанавливаем данные полей
  window.scrollTo(0, scrollPos);
}

/* PUBLIC DOWNLOAD & REQUEST PAGE */
function renderPublicDownloadPage() {
  const mode = session.publicMode || 'request';

  return `
  <div class="public-wrap fade-in">
    <div style="display:flex; gap:8px; width:100%; margin-bottom:16px;">
      <button class="btn ${mode === 'request' ? 'gold' : 'outline'}" onclick="session.publicMode='request'; saveSession(); render();">Оформить заявку</button>
      <button class="btn ${mode === 'download' ? 'gold' : 'outline'}" onclick="session.publicMode='download'; saveSession(); render();">Скачать фото</button>
    </div>

    ${mode === 'request' ? `
      <h2>Получить фотографии</h2>
      <p style="color:var(--ink-soft); font-size:13px;">Выберите точку покупки, заполните данные и сфотографируйте магнит</p>
      
      <div class="panel" style="width:100%; text-align:left;">
        <div class="field">
          <label class="field-label">Точка, где вы покупали</label>
          <select id="custPointId" onchange="formBuffer['custPointId']=this.value">
            <option value="">-- Выберите точку --</option>
            ${state.points.map(pt => `<option value="${pt.id}">${pt.name}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Ваше Имя</label>
          <input type="text" id="custName" placeholder="Иван" oninput="formBuffer['custName']=this.value">
        </div>
        <div class="field">
          <label class="field-label">Номер телефона</label>
          <input type="text" id="custPhone" placeholder="+7 900 000 00 00" oninput="formBuffer['custPhone']=this.value">
        </div>
        <div class="field">
          <label class="field-label">Фотография магнита</label>
          <input type="file" id="custMagnetFile" accept="image/*">
        </div>
        <button class="btn gold" onclick="submitCustomerRequest()">Отправить заявку продавцу</button>
      </div>
    ` : `
      <h2>Скачать Фотографии</h2>
      <p style="color:var(--ink-soft); font-size:13px;">Введите код заказа для получения фотографий</p>
      <div style="width:100%; margin:16px 0;">
        <input type="text" id="photoCodeInput" value="${currentSearchedCode}" placeholder="Код заказа (например 1024)" style="text-align:center; font-size:18px;" oninput="formBuffer['photoCodeInput']=this.value">
        <button class="btn gold" onclick="searchPhotoByCode()">Найти фото</button>
      </div>
      <div id="photoSearchResult" style="width:100%;">${currentSearchResultHtml}</div>
    `}

    <div style="margin-top:24px; font-size:13px; color:var(--ink-soft); background:var(--surface); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--line); width:100%;">
      Возникли проблемы или ошибки?<br>
      Обратная связь: <a href="tel:+79256860074" style="color:var(--brass); text-decoration:none; font-weight:600;">+7 925 686 00 74</a>
    </div>
    <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:20px; width:100%;">
      <button class="btn outline" onclick="switchCurrentTab('login')">Вход для персонала</button>
    </div>
  </div>`;
}

async function submitCustomerRequest() {
  const pointId = document.getElementById('custPointId').value;
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const fileInput = document.getElementById('custMagnetFile');
  const file = fileInput ? fileInput.files[0] : null;

  if(!pointId) return toast('Выберите точку, где делали покупку', true);
  if(!name || !phone || !file) return toast('Заполните имя, телефон и выберите фото магнита', true);

  toast('Загрузка снимка...');

  const formData = new FormData();
  formData.append('image', file);

  try {
    const response = await fetch(`[https://api.imgbb.com/1/upload?key=$](https://api.imgbb.com/1/upload?key=$){IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    const result = await response.json();

    if(result.success) {
      state.customerRequests.unshift({
        id: uid(),
        pointId,
        name,
        phone,
        magnetUrl: result.data.url,
        date: nowFormatted(),
        status: 'pending'
      });
      
      // Очищаем DOM элементы и локальный буфер после успешной отправки заявки
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custPointId').value = '';
      if(fileInput) fileInput.value = '';

      delete formBuffer['custName'];
      delete formBuffer['custPhone'];
      delete formBuffer['custPointId'];

      saveData();
      alert('Заявка успешно отправлена! Продавец этой точки уже обрабатывает её.');
      session.publicMode = 'download';
      saveSession();
      render();
    } else {
      toast('Ошибка загрузки фото', true);
    }
  } catch(e) {
    toast('Ошибка сети при загрузке', true);
  }
}

function rejectCustomerRequest(requestId) {
  if (confirm('Отклонить эту заявку от клиента?')) {
    const req = state.customerRequests.find(r => r.id === requestId);
    if (req) {
      req.status = 'rejected';
      saveData();
      toast('Заявка отклонена');
    }
  }
}

function searchPhotoByCode() {
  const codeInput = document.getElementById('photoCodeInput');
  const code = codeInput ? codeInput.value.trim() : '';
  const res = document.getElementById('photoSearchResult');
  if(!code) return toast('Введите код', true);

  currentSearchedCode = code;

  const photos = state.digitalPhotos.filter(p => p.code === code);
  if(!photos.length) {
    currentSearchResultHtml = `<p style="color:var(--red); margin-top:12px;">Фотографии не найдены</p>`;
    if (res) res.innerHTML = currentSearchResultHtml;
    return;
  }

  currentSearchResultHtml = `
    <div style="margin-top:16px; width:100%;">
      <p style="font-size:13px; color:var(--green); font-weight:600; margin-bottom:12px;">Найдено снимков: ${photos.length}</p>
      ${photos.map((p, idx) => `
        <div class="panel fade-in" style="margin-bottom:12px; text-align:left;">
          <img src="${p.photoUrl}" style="width:100%; border-radius:var(--radius-sm); margin-bottom:10px; cursor:pointer;" onclick="openLightbox('${p.photoUrl}')">
          <button class="btn green" onclick="downloadPhotoFile('${p.id}', '${p.photoUrl}', 'photo_${p.code}_${idx+1}.jpg')">Скачать оригинал</button>
        </div>
      `).join('')}
    </div>
  `;
  if (res) res.innerHTML = currentSearchResultHtml;
}

function downloadPhotoFile(photoId, url, filename) {
  const p = state.digitalPhotos.find(item => item.id === photoId);
  if (p) {
    p.downloaded = true;
    p.downloadCount = (p.downloadCount || 0) + 1;
    saveData();
  }

  fetch(url)
    .then(res => res.blob())
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('Загрузка начата...');
    })
    .catch(() => {
      window.open(url, '_blank');
    });
}

function renderAuthPage() {
  return `
  <div class="public-wrap fade-in">
    <h2>Вход в Систему</h2>
    <p style="color:var(--ink-soft); font-size:13px; margin-bottom:20px;">Авторизация для сотрудников и владельца</p>
    <div class="panel" style="width:100%; text-align:left;">
      <div class="field">
        <label class="field-label">Логин</label>
        <input type="text" id="loginUsername" placeholder="Введите логин" oninput="formBuffer['loginUsername']=this.value">
      </div>
      <div class="field">
        <label class="field-label">Пароль</label>
        <input type="password" id="loginPassword" placeholder="Введите пароль" oninput="formBuffer['loginPassword']=this.value">
      </div>
      <button class="btn gold" onclick="handleLogin()">Войти</button>
    </div>
    <button class="btn outline" style="margin-top:16px;" onclick="switchCurrentTab('download_public')">Вернуться к скачиванию</button>
  </div>`;
}

function handleLogin() {
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value.trim();
  const user = state.users.find(usr => usr.username.toLowerCase() === u.toLowerCase() && usr.password === p);

  if(!user) return toast('Неверный логин или пароль', true);

  session.userId = user.id;
  session.currentTab = 'app';
  if(user.role === 'owner') session.ownerSubTab = 'overview';
  else session.userSubTab = 'main';
  
  saveSession();
  render();
}

function logout() {
  session.userId = null;
  session.currentTab = 'download_public';
  saveSession();
  render();
}

// ==========================================
// 3. ОБЩИЙ МОДУЛЬ ЧАТА ВНУТРИ ПАНЕЛЕЙ
// ==========================================
function renderChatModule(currentUser) {
  const activeTarget = session.activeChatTarget || 'all';
  
  let availableDialogs = [{ id: 'all', name: 'Общий чат' }];
  if (currentUser.role === 'owner') {
    state.users.filter(u => u.id !== currentUser.id).forEach(u => {
      availableDialogs.push({ id: u.id, name: `${u.username} (${u.role === 'employee' ? 'Продавец' : 'Закупщик'})` });
    });
  } else {
    const owner = state.users.find(u => u.role === 'owner');
    if (owner) {
      availableDialogs.push({ id: owner.id, name: 'Владелец (Личные)' });
    }
  }

  const filteredMessages = state.chatMessages.filter(m => {
    if (activeTarget === 'all') return m.targetId === 'all';
    return (m.senderId === currentUser.id && m.targetId === activeTarget) ||
           (m.senderId === activeTarget && m.targetId === currentUser.id);
  });

  return `
    <div class="panel">
      <h2>Сообщения и Чат</h2>
      <div class="messenger-layout">
        <div class="chat-sidebar">
          ${availableDialogs.map(d => {
            const unread = getUnreadCountForDialog(currentUser, d.id);
            return `
              <div class="dialog-item ${activeTarget === d.id ? 'active' : ''}" onclick="session.activeChatTarget='${d.id}'; saveSession(); render();">
                <span>${d.name}</span>
                ${unread > 0 ? `<span class="dialog-badge">+${unread}</span>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        <div class="chat-main">
          <div class="chat-header">
            ${availableDialogs.find(d => d.id === activeTarget)?.name || 'Чат'}
          </div>
          <div class="chat-box" id="chatBox">
            ${filteredMessages.length === 0 ? `<div style="text-align:center; color:var(--ink-soft); font-size:12px; margin-top:20px;">Нет сообщений</div>` : ''}
            ${filteredMessages.map(m => {
              const isMine = m.senderId === currentUser.id;
              return `
                <div class="chat-msg ${isMine ? 'mine' : ''}">
                  <div class="chat-msg-header">
                    <span>${m.senderName}</span>
                    <span>${m.date}</span>
                  </div>
                  <div class="chat-msg-body">${m.text}</div>
                  ${m.photoUrl ? `<img src="${m.photoUrl}" style="max-width:100%; border-radius:6px; cursor:pointer;" onclick="openLightbox('${m.photoUrl}')">` : ''}
                </div>
              `;
            }).join('')}
          </div>
          <div style="padding:10px; background:var(--surface); border-top:1px solid var(--line); display:flex; gap:8px; align-items:center;">
            <input type="text" id="chatInputText" placeholder="Напишите сообщение..." style="flex:1; margin:0;" onkeydown="if(event.key==='Enter') sendChatMessage('${currentUser.id}', '${currentUser.username}')">
            <label class="btn outline small" style="margin:0; width:auto; cursor:pointer; display:flex; align-items:center; justify-content:center;">
              📷 <input type="file" id="chatInputFile" accept="image/*" style="display:none;" onchange="sendChatMessage('${currentUser.id}', '${currentUser.username}')">
            </label>
            <button class="btn gold small" style="margin:0;" onclick="sendChatMessage('${currentUser.id}', '${currentUser.username}')">Отправить</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function sendChatMessage(senderId, senderName) {
  const textInput = document.getElementById('chatInputText');
  const fileInput = document.getElementById('chatInputFile');
  const text = textInput ? textInput.value.trim() : '';
  const file = fileInput && fileInput.files.length > 0 ? fileInput.files[0] : null;

  if (!text && !file) return;

  const targetId = session.activeChatTarget || 'all';
  let photoUrl = '';

  if (file) {
    toast('Загрузка картинки...');
    const formData = new FormData();
    formData.append('image', file);
    try {
      const res = await fetch(`[https://api.imgbb.com/1/upload?key=$](https://api.imgbb.com/1/upload?key=$){IMGBB_API_KEY}`, { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success) photoUrl = data.data.url;
    } catch(e) {
      toast('Ошибка загрузки фото в чат', true);
      return;
    }
  }

  state.chatMessages.push({
    id: uid(),
    senderId,
    senderName,
    targetId,
    text,
    photoUrl,
    date: nowFormatted(),
    readBy: [senderId]
  });

  if (textInput) textInput.value = '';
  if (fileInput) fileInput.value = '';

  saveData();
  render();
  setTimeout(() => {
    const box = document.getElementById('chatBox');
    if (box) box.scrollTop = box.scrollHeight;
  }, 100);
}
